# Source of truth for the Xcode project. `MoldCompanion.xcodeproj` is
# GENERATED by `make gen` and is gitignored -- never edit it, never check it in.
# Mirrors apps/macos/project.yml's settings on purpose: one strictness, one
# actor default, one version source for both native apps.
name: MoldCompanion

# Generated by `make gen` from the workspace version.
include:
  - Version.yml

options:
  deploymentTarget:
    iOS: "26.0"
  minimumXcodeGenVersion: "2.44.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    # iPhone and iPad: one adaptive app (DESIGN.md §4).
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: 28X9H69QGE
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: "YES"
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"

packages:
  MoldClient:
    path: ../shared/Packages/MoldClient
  MoldStyle:
    path: ../shared/Packages/MoldStyle

targets:
  MoldCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources/Companion
      - path: Sources/Shared
    dependencies:
      - package: MoldClient
      - package: MoldStyle
      - target: MoldCompanionWidgets
      - target: MoldCompanionShare
    settings:
      base:
        # The Home Screen says "Mold Studio" (CFBundleDisplayName in
        # Info.plist); the App Store record is "Mold Studio Companion".
        PRODUCT_NAME: Mold Studio
        PRODUCT_MODULE_NAME: MoldCompanion
        # Deliberately NOT com.utensils.mold (the Tauri iPhone app) nor
        # io.utensils.mold.native (the Mac app): all three install side by side.
        PRODUCT_BUNDLE_IDENTIFIER: io.utensils.mold.companion
        INFOPLIST_FILE: Sources/Companion/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Companion/Resources/MoldCompanion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Darker than system blue in light mode: white on #007AFF is ~4.0:1
        # and failed the contrast audit; #0062CC is 5.8:1 (DESIGN.md §6).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - MoldCompanionTests
        - MoldCompanionUITests

  # Home Screen widgets and the Live Activity. Reads the App Group snapshot
  # only: no network, no Keychain (DESIGN.md §5.8; `make lint` enforces it).
  MoldCompanionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: MoldCompanionWidgets
        PRODUCT_BUNDLE_IDENTIFIER: io.utensils.mold.companion.widgets
        INFOPLIST_FILE: Sources/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Widgets/MoldCompanionWidgets.entitlements
        SKIP_INSTALL: "YES"

  # Share ▸ Mold Studio. Stages a photo in the App Group for the app to pick
  # up; makes no network calls (DESIGN.md §5.9).
  MoldCompanionShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Share
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: MoldCompanionShare
        PRODUCT_BUNDLE_IDENTIFIER: io.utensils.mold.companion.share
        INFOPLIST_FILE: Sources/Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Share/MoldCompanionShare.entitlements
        SKIP_INSTALL: "YES"

  MoldCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CompanionTests
    dependencies:
      - target: MoldCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mold Studio.app/Mold Studio"
        BUNDLE_LOADER: "$(TEST_HOST)"

  MoldCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CompanionUITests
    dependencies:
      - target: MoldCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: MoldCompanion
        # XCTestCase's initializers are nonisolated, so the app's MainActor
        # default cannot apply here; each test opts in with @MainActor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
