# Source of truth for the Xcode project. `Mold.xcodeproj` is GENERATED by
# `make gen` and is gitignored -- never edit it, and never check it in.
name: Mold

options:
  deploymentTarget:
    macOS: "26.0"
  minimumXcodeGenVersion: "2.44.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    # The whole app is checked under Swift 6 strict concurrency. Turning this
    # down later is far harder than starting here.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    # Not sandboxed: the app talks to arbitrary hosts on the LAN and over
    # Tailscale, and holds a models directory the user points at.
    ENABLE_APP_SANDBOX: "NO"
    # Ad-hoc, so `make build` works on a machine with no signing identity.
    # `make release` re-signs properly. The Makefile overrides this with
    # MOLD_DEV_SIGN_IDENTITY when this Mac has a real identity, so a dev
    # build keeps one identity across rebuilds and TCC grants persist.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
    Debug:
      # Stated, not left to xcodegen's Debug preset: the preset is dropped for
      # any key the config file defines, and `make engine` writes this key into
      # Engine.xcconfig -- so on a Mac with the engine linked a Debug build lost
      # DEBUG entirely, every `#if DEBUG` UAT hook compiled out, and their
      # tests passed by running nothing. `$(inherited)` keeps the xcconfig's
      # MOLD_EMBEDDED_ENGINE beside it.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"

packages:
  MoldClient:
    path: Packages/MoldClient
  MoldStyle:
    path: Packages/MoldStyle

configFiles:
  Debug: Engine.xcconfig
  Release: Engine.xcconfig

targets:
  Mold:
    type: application
    platform: macOS
    sources:
      - path: Sources/Mold
    dependencies:
      - package: MoldClient
      - package: MoldStyle
    settings:
      base:
        PRODUCT_NAME: Mold
        # Deliberately NOT com.utensils.mold -- the Tauri app owns that, and
        # sharing it would collide in Launch Services.
        PRODUCT_BUNDLE_IDENTIFIER: io.utensils.mold.native
        INFOPLIST_FILE: Sources/Mold/Resources/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Mold/Engine/MoldEngineBridge.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Baked in at every build, not just `make release`'s final re-sign, so
        # a Debug build under a real signing identity (see
        # MOLD_DEV_SIGN_IDENTITY in the Makefile) carries the
        # library-validation exemption the test host needs to launch -- and
        # RELEASE does not, because that exemption's only surviving reason is
        # this Debug path (review F7).
        Debug:
          CODE_SIGN_ENTITLEMENTS: scripts/Mold.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: scripts/Mold.entitlements
    scheme:
      testTargets:
        - MoldTests
      # A host-app test bundle LAUNCHES the app, so the scheme needs the same
      # throwaway prefs domain and scratch home `make uat` uses -- otherwise a
      # test run reads and writes the real machine list. The target-level
      # `scheme:` shorthand has no separate test/run split, which is fine here:
      # nothing else uses this scheme's launch action.
      environmentVariables:
        MOLD_NATIVE_FRESH: "1"
        MOLD_HOME: "$(TEMP_DIR)/mold-native-tests"

  MoldTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MoldTests
    dependencies:
      - target: Mold
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mold.app/Contents/MacOS/Mold"
        BUNDLE_LOADER: "$(TEST_HOST)"
