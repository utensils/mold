[package]
name = "mold-mobile"
version = "0.20.2"
edition = "2024"
license = "MIT"
description = "Mold iOS companion for remote generation and gallery access"
authors = [
    "James Brink <brink.james@gmail.com>",
    "Jeffrey Dilley <jeff.dilley@gmail.com>",
]

[workspace]

[lib]
name = "mold_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2.4.9"

[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["UIInterface", "UIImage", "UIPasteboard", "UIResponder", "UIViewController"] }
tauri-plugin-barcode-scanner = "2.4.5"

[features]
default = []
