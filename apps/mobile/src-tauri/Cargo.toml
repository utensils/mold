[package]
name = "mold-mobile"
version = "0.19.0"
edition = "2024"
license = "MIT"
description = "Mold iOS companion for remote generation and gallery access"
authors = ["James Brink <brink.james@gmail.com>"]

[workspace]

[lib]
name = "mold_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["UIInterface", "UIResponder", "UIViewController"] }

[features]
default = []
