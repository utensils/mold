# cargo-nextest configuration. Three profiles:
#
#   default  everything -- what `cargo nextest run` does locally and what a
#            push to `main` executes for the default-feature workspace.
#   union    the DEFAULT-FEATURE ASSERTIONS excluded -- for a build with the
#            optional-feature union (`scripts/ci/affected-packages.py`,
#            FEATURE_UNION) on. The 6 tests below pin what a
#            default-feature build advertises (the factory family registry, the
#            checked-in capability matrix, a media-preprocessing path that the
#            mesh/PuLID ONNX stack changes) and are false by construction once
#            every feature is on; `main` still runs them in its default build.
#   pr       `union` plus the HEAVY long tail excluded -- the pull-request
#            tier. 116 tests that each took 3 s or more in a local run
#            (2026-09-10, `cargo nextest run -p mold-ai-inference -p
#            mold-ai-server --lib --status-level pass`) together held about
#            78% of the workspace's execution time on the 4-vCPU GitHub runner,
#            where the `rust` job spent 10.6 of its 15 test minutes executing
#            rather than compiling. They are synthetic CPU renders (LTX-2
#            runtime, Wan VAE tiling, PuLID variant bit-identity, the 10k-entry
#            batch journal) and still run on every push to `main` and locally
#            by default; a PR only stops paying for them. To refresh the list
#            rerun that command, sort by duration, and replace the block.
#
# Every clause is an EXACT `test(=name)` match, so a renamed or new heavy test
# rejoins the PR tier on its own rather than vanishing from `main`.

[profile.default]
fail-fast = false
slow-timeout = { period = "120s" }

[profile.union]
fail-fast = false
slow-timeout = { period = "120s" }
default-filter = """
not (
  (binary_id(mold-ai-inference) & test(=batch::tests::production_family_batch_registry_is_explicit_valid_and_singleton_only)) |
  (binary_id(mold-ai-inference::family_capability_contract) & test(=every_factory_family_has_one_complete_weight_free_capability_contract)) |
  (binary_id(mold-ai-inference::family_capability_contract) & test(=qualification_references_and_checked_in_matrix_are_concrete)) |
  (binary_id(mold-ai-inference::family_capability_contract) & test(=the_qualification_matrix_block_offload_column_matches_the_registry)) |
  (binary_id(mold-ai-inference) & test(=minimax_h3::engine::tests::ref2va_runtime_executes_the_phase_sequence_over_production_media_preprocessing)) |
  (binary_id(mold-ai-server) & test(=routes_test::tests::durable_direct_raw_observer_preserves_the_legacy_media_response))
)
"""

[profile.pr]
fail-fast = false
slow-timeout = { period = "120s" }
default-filter = """
