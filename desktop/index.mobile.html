<!doctype html>
<html lang="en" data-theme="safelight">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12101d" />
    <meta name="mold-mobile-entry" content="mold-mobile-entry-v1" />
    <title>Mold</title>
    <script>
      // Apply the saved mobile theme before first paint. Mirrors
      // src/mobile/settings.ts: a named theme wins, the pre-redesign
      // family + appearance pair migrates, and a fresh phone starts on
      // Safelight.
      (function () {
        var pair = {
          mocha: ["mocha", "blueprint"],
          blueprint: ["mocha", "blueprint"],
          graphite: ["graphite", "porcelain"],
          porcelain: ["graphite", "porcelain"],
          safelight: ["safelight", "porcelain"],
          nebula: ["nebula", "porcelain"],
        };
        var theme = "safelight";
        var matchSystem = false;
        try {
          var raw = localStorage.getItem("mold.mobile.settings.v1");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (pair[parsed.theme]) {
              theme = parsed.theme;
              matchSystem = parsed.matchSystem === true;
            } else if (parsed.themeFamily === "mold") {
              theme = parsed.theme === "light" ? "blueprint" : "mocha";
              matchSystem = parsed.theme === "system";
            } else {
              if (parsed.theme === "light") theme = "porcelain";
              matchSystem = parsed.theme === "system";
            }
          }
        } catch (e) {}
        if (matchSystem && window.matchMedia) {
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          theme = pair[theme][light ? 1 : 0];
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/mobile/main.ts"></script>
  </body>
</html>
