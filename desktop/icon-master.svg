<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    macOS app icon master: the mold logo (website/public/favicon.svg) placed
    in Apple's 824x824 content box centered on a 1024 canvas. The logo's
    rx=14/64 corner ratio scales to ~180px at 824 - right at the HIG squircle
    radius, so the mark drops into the Dock without remastering.
    Regenerate the bundle icons with: cargo tauri icon desktop/icon-master.svg
  -->
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
  </defs>
  <g transform="translate(100 100) scale(12.875)">
    <rect width="64" height="64" rx="14" fill="#1a1a2e"/>
    <text x="32" y="44" font-family="monospace" font-weight="bold" font-size="28" fill="url(#g)" text-anchor="middle">m</text>
  </g>
</svg>
