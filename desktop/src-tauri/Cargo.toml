[package]
name = "mold-desktop"
version = "0.23.3"
description = "Mold — native desktop app for local AI image/video generation"
authors = [
    "James Brink <brink.james@gmail.com>",
    "Jeffrey Dilley <jeff.dilley@gmail.com>",
]
license = "MIT"
repository = "https://github.com/utensils/mold"
edition = "2021"
rust-version = "1.93"

# This crate is deliberately its own cargo root (see the root Cargo.toml
# [workspace] exclude): the Tauri dependency tree must not enter the CUDA
# workspace, its lockfile, or the `--workspace` CI gates. The empty table
# below makes that standalone-root status explicit so cargo never walks up
# to the outer workspace (git worktrees under .claude/worktrees otherwise
# escape the path-based exclude).
[workspace]

[lib]
name = "mold_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` keeps the inspector available in release builds, entered via
# View → Developer Tools. The webview context menu is suppressed on all app
# chrome (App.vue); text-editing fields keep their native menu, which with
# developer extras on may itself list Inspect Element — acceptable, since
# devtools are sanctioned anyway.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tracing = "0.1"
# Local interface enumeration so discovered servers can be flagged "This Mac".
if-addrs = "0.15"
hostname = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "blocking",
  "stream",
] }
futures-util = "0.3"
libc = "0.2"
time = { version = "0.3", features = ["formatting"] }
flate2 = "1"
plist = "1"
tar = "0.4"
tempfile = "3"
filetime = "0.2"
sha2 = "0.10"
mold-core = { path = "../../crates/mold-core", package = "mold-ai-core", version = "0.23.3" }
mold-db = { path = "../../crates/mold-db", package = "mold-ai-db", version = "0.23.3" }
mold-server = { path = "../../crates/mold-server", package = "mold-ai-server", version = "0.23.3", features = [
  "expand",
  "mdns",
] }

# AAC muxing is everywhere except Windows. `mp4` pulls `fdk-aac-sys`, whose
# `FDK_archdef.h` recognises only GCC/Clang architecture macros and falls
# through to a `#warning` for every MSVC target — and MSVC raises that as the
# fatal C1021, so the crate cannot build with the Microsoft toolchain on x64 or
# ARM64. Cargo features are additive per target, so this entry turns `mp4` on
# for every non-Windows target and leaves the Windows build with mold's own
# `#[cfg(not(feature = "mp4"))]` arm: video still renders and muxes through the
# pure-Rust mp4 writer, and only a generated AAC track is refused, by name.
[target.'cfg(not(windows))'.dependencies]
mold-server = { path = "../../crates/mold-server", package = "mold-ai-server", version = "0.23.3", features = [
  "mp4",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Use Apple's native DNS-SD stack for desktop discovery. Raw multicast sockets
# can miss services that mDNSResponder already has in its shared cache.
mdns-sd-discovery = "0.2.0"
# Use Apple's current notification framework so release alerts inherit the
# signed Mold bundle identity and CFBundleIconFile on modern macOS.
block2 = "0.6"
objc2-user-notifications = "0.3"
# Give debug builds an unmistakable native menu and Dock identity.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSBundle", "NSProcessInfo", "NSString"] }
# macOS 26 can make standard overlay-titlebar controls fully transparent when
# their window resigns key. Keep the native buttons and repair only that state.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSColor", "NSView", "NSWindow", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "objc2-core-foundation", "objc2-core-graphics"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri's notification click actions are mobile-only. Use the XDG handle so
# Linux notification-body clicks carry the same semantic routes as macOS.
notify-rust = "4.18"

[features]
default = []
# CPU-only by default so CI runs without a GPU; desktop-dev/desktop-build
# turn on the native GPU backend for real generation.
cuda = ["mold-server/cuda", "nvml"]
# Device-free like the workspace's own `h3` (#1164). The Linux desktop
# package names `h3-cuda`; `h3` + `cuda` is the graph that silently drops the
# SM89 attention kernel and the mold-server build fence refuses it.
h3 = ["mold-core/h3", "mold-server/h3"]
h3-cuda = ["h3", "cuda", "mold-server/h3-cuda"]
nvml = ["mold-server/nvml"]
metal = ["mold-server/metal"]
# Face-identity conditioning (#1223). Unconditional in every desktop recipe,
# for the same reason it is unconditional in every `mold` release recipe: the
# embedded **This device** server advertises `supports_identity` only when the
# feature is compiled, and `studio/lib/identityConditioning.ts` gates the
# identity photo well on that advertisement — absence reads as NO. A desktop
# build without `pulid` therefore hides the whole feature permanently rather
# than degrading, and no runtime setting can recover it.
#
# `mold-core` is named explicitly even though `mold-server/pulid` already
# forwards to it: this crate depends on `mold-core` directly, and the gate
# `mold_core::identity::identity_runtime_available()` is `cfg!(feature =
# "pulid")` inside mold-core's own compilation.
pulid = ["mold-core/pulid", "mold-server/pulid"]

[profile.release]
lto = "thin"
codegen-units = 16
strip = true

[dev-dependencies]

# TEMPORARY: mirror the root workspace's same-name compatibility patch because
# this standalone Cargo root owns an independent dependency graph.
[patch.crates-io]
candle-core = { git = "https://github.com/utensils/candle", branch = "fix/mold-compat-0.11" }
candle-nn = { git = "https://github.com/utensils/candle", branch = "fix/mold-compat-0.11" }
candle-transformers = { git = "https://github.com/utensils/candle", branch = "fix/mold-compat-0.11" }
cudarc = { git = "https://github.com/utensils/cudarc", rev = "9b3b1bc276bc27c3e99343ee82db7f99705b9ed5" }
