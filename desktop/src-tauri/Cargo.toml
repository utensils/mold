[package]
name = "mold-desktop"
version = "0.1.0"
description = "Mold — native desktop app for local AI image/video generation"
authors = ["James Brink <brink.james@gmail.com>"]
license = "MIT"
repository = "https://github.com/utensils/mold"
edition = "2021"
rust-version = "1.85"

# This crate is deliberately its own cargo root (see the root Cargo.toml
# [workspace] exclude): the Tauri dependency tree must not enter the CUDA
# workspace, its lockfile, or the `--workspace` CI gates.

[lib]
name = "mold_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[features]
default = []
# The embedded Metal engine (mold-server) attaches here in M1:
# metal = ["mold-server/metal"]

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
