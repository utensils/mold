[package]
name = "mold-desktop"
version = "0.1.0"
description = "Mold — native desktop app for local AI image/video generation"
authors = ["James Brink <brink.james@gmail.com>"]
license = "MIT"
repository = "https://github.com/utensils/mold"
edition = "2021"
rust-version = "1.85"

# This crate is deliberately its own cargo root (see the root Cargo.toml
# [workspace] exclude): the Tauri dependency tree must not enter the CUDA
# workspace, its lockfile, or the `--workspace` CI gates.

[lib]
name = "mold_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "blocking",
] }
mold-core = { path = "../../crates/mold-core", package = "mold-ai-core", version = "0.14.0" }
mold-db = { path = "../../crates/mold-db", package = "mold-ai-db", version = "0.14.0" }
mold-server = { path = "../../crates/mold-server", package = "mold-ai-server", version = "0.14.0", features = [
  "expand",
  "mp4",
] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# CPU-only by default so CI runs without a GPU; desktop-dev/desktop-build
# turn this on for real Metal generation.
metal = ["mold-server/metal"]

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
