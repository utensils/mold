[package]
name = "mold-desktop"
version = "0.16.0"
description = "Mold — native desktop app for local AI image/video generation"
authors = ["James Brink <brink.james@gmail.com>"]
license = "MIT"
repository = "https://github.com/utensils/mold"
edition = "2021"
rust-version = "1.85"

# This crate is deliberately its own cargo root (see the root Cargo.toml
# [workspace] exclude): the Tauri dependency tree must not enter the CUDA
# workspace, its lockfile, or the `--workspace` CI gates.

[lib]
name = "mold_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tracing = "0.1"
# Local interface enumeration so discovered servers can be flagged "This Mac".
if-addrs = "0.15"
hostname = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "blocking",
] }
libc = "0.2"
time = { version = "0.3", features = ["formatting"] }
flate2 = "1"
plist = "1"
tar = "0.4"
mold-core = { path = "../../crates/mold-core", package = "mold-ai-core", version = "0.16.0" }
mold-db = { path = "../../crates/mold-db", package = "mold-ai-db", version = "0.16.0" }
mold-server = { path = "../../crates/mold-server", package = "mold-ai-server", version = "0.16.0", features = [
  "expand",
  "mp4",
  "mdns",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Use Apple's native DNS-SD stack for desktop discovery. Raw multicast sockets
# can miss services that mDNSResponder already has in its shared cache.
mdns-sd-discovery = "0.2.0"

[dev-dependencies]
tempfile = "3"

[features]
default = []
# CPU-only by default so CI runs without a GPU; desktop-dev/desktop-build
# turn this on for real Metal generation.
metal = ["mold-server/metal"]

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
