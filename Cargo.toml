[workspace]
members = [
    "crates/mold-core",
    "crates/mold-db",
    "crates/mold-inference",
    "crates/mold-server",
    "crates/mold-cli",
    "crates/mold-discord",
    "crates/mold-tui",
    "crates/mold-catalog",
    "crates/mold-scheduler",
    "crates/mold-candle",
]
# The Tauri desktop and iOS apps are standalone cargo roots: their platform UI
# dependencies must stay out of this workspace's lockfile and `--workspace` CI.
# See desktop/docs/architecture.md.
exclude = ["desktop/src-tauri", "apps/mobile/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.25.0"
edition = "2021"
license = "MIT"
authors = [
    "James Brink <brink.james@gmail.com>",
    "Jeffrey Dilley <jeff.dilley@gmail.com>",
]
description = "CLI-native local AI image and video generation for people, scripts, and agents"
rust-version = "1.93"
homepage = "https://github.com/utensils/mold"
repository = "https://github.com/utensils/mold"
readme = "README.md"
keywords = ["ai", "image-generation", "diffusion", "flux", "gpu"]
categories = ["command-line-utilities", "multimedia::images", "science"]

[workspace.metadata.crane]
name = "mold"

[profile.release]
lto = "thin"
codegen-units = 16
strip = true

[profile.dev-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
debug = 1
strip = false

# TEMPORARY: compatibility patches while the remaining backend fixes land
# upstream. Remove patches individually as upstream releases absorb them.
#
# Candle itself is NOT patched here any more. #1393 needed merged fork kernels
# that ship under the renamed `candle-*-mold` package identities, which
# `[patch.crates-io]` cannot express (a patch must keep the patched package's
# name). Every candle crate is therefore a direct git dependency on ONE fork
# revision, and `candle-flash-attn` and `candle-onnx` must move with it: a
# crates.io copy of either pulls the upstream-named `candle-core` alongside
# `candle-core-mold` and two nominally distinct `Tensor` types land in one
# graph (#1399). `scripts/tests/candle-single-identity.sh` enforces that.
[patch.crates-io]
cudarc = { git = "https://github.com/utensils/cudarc", rev = "9b3b1bc276bc27c3e99343ee82db7f99705b9ed5" }
