[workspace]
members = [
    "crates/mold-core",
    "crates/mold-db",
    "crates/mold-inference",
    "crates/mold-server",
    "crates/mold-cli",
    "crates/mold-discord",
    "crates/mold-tui",
    "crates/mold-catalog",
    "crates/mold-scheduler",
    "crates/mold-candle",
]
# The Tauri desktop and iOS apps are standalone cargo roots: their platform UI
# dependencies must stay out of this workspace's lockfile and `--workspace` CI.
# See desktop/docs/architecture.md.
exclude = ["desktop/src-tauri", "apps/mobile/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.23.2"
edition = "2021"
license = "MIT"
authors = [
    "James Brink <brink.james@gmail.com>",
    "Jeffrey Dilley <jeff.dilley@gmail.com>",
]
description = "CLI-native local AI image and video generation for people, scripts, and agents"
rust-version = "1.93"
homepage = "https://github.com/utensils/mold"
repository = "https://github.com/utensils/mold"
readme = "README.md"
keywords = ["ai", "image-generation", "diffusion", "flux", "gpu"]
categories = ["command-line-utilities", "multimedia::images", "science"]

[workspace.metadata.crane]
name = "mold"

[profile.release]
lto = "thin"
codegen-units = 16
strip = true

[profile.dev-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
debug = 1
strip = false

# TEMPORARY: one-package-identity compatibility patch while the remaining
# backend fixes land upstream. Unlike the old `candle-*-mold` packages, these
# crates retain Candle's upstream package names, so every transitive consumer
# shares one `Tensor` type. Remove patches individually as upstream releases
# absorb them.
[patch.crates-io]
candle-core = { git = "https://github.com/utensils/candle", branch = "fix/mold-compat-0.11" }
candle-nn = { git = "https://github.com/utensils/candle", branch = "fix/mold-compat-0.11" }
candle-transformers = { git = "https://github.com/utensils/candle", branch = "fix/mold-compat-0.11" }
cudarc = { git = "https://github.com/utensils/cudarc", rev = "9b3b1bc276bc27c3e99343ee82db7f99705b9ed5" }
