[workspace]
members = [
    "crates/mold-core",
    "crates/mold-db",
    "crates/mold-inference",
    "crates/mold-server",
    "crates/mold-cli",
    "crates/mold-discord",
    "crates/mold-tui",
    "crates/mold-catalog",
]
# The Tauri desktop and iOS apps are standalone cargo roots: their platform UI
# dependencies must stay out of this workspace's lockfile and `--workspace` CI.
# See desktop/docs/architecture.md.
exclude = ["desktop/src-tauri", "apps/mobile/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.20.2"
edition = "2021"
license = "MIT"
authors = [
    "James Brink <brink.james@gmail.com>",
    "Jeffrey Dilley <jeff.dilley@gmail.com>",
]
description = "CLI-native local AI image and video generation for people, scripts, and agents"
rust-version = "1.85"
homepage = "https://github.com/utensils/mold"
repository = "https://github.com/utensils/mold"
readme = "README.md"
keywords = ["ai", "image-generation", "diffusion", "flux", "gpu"]
categories = ["command-line-utilities", "multimedia::images", "science"]

[workspace.metadata.crane]
name = "mold"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
debug = 1
strip = false
