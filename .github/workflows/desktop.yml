name: Desktop

# CI for the experimental Tauri desktop app (desktop/). The root ci.yml is
# untouched by this surface: desktop/src-tauri is excluded from the cargo
# workspace, so --workspace gates never see it.
# These jobs are NOT required status checks, so plain `paths` trigger filters
# are safe here (a filtered-out run reports nothing and blocks nothing) — the
# required checks in ci.yml use job-level `if:` gating instead.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "crates/mold-core/**"
      - "crates/mold-catalog/**"
      - "crates/mold-db/**"
      - "crates/mold-inference/**"
      - "crates/mold-server/**"
      - "flake.nix"
      - "Cargo.toml"
      - ".github/workflows/desktop.yml"
      - "scripts/verify-desktop-release.sh"
  pull_request:
    paths:
      - "desktop/**"
      - "crates/mold-core/**"
      - "crates/mold-catalog/**"
      - "crates/mold-db/**"
      - "crates/mold-inference/**"
      - "crates/mold-server/**"
      - "flake.nix"
      - "Cargo.toml"
      - ".github/workflows/desktop.yml"
      - "scripts/verify-desktop-release.sh"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-frontend:
    name: Frontend (typecheck, tests, format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bunx vue-tsc -b
      - run: bun run test
      - run: bun run build

  desktop-rust:
    name: Rust (fmt, clippy, test, bundle)
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: bun install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # CPU-only: the metal feature is deliberately off in CI.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Bundle proof (unsigned .app)
        run: bunx tauri build --bundles app --ci

  # The signed + notarized distribution build lives in
  # desktop-distribution.yml: release.yml calls it on v* tags so the DMG
  # ships on the GitHub release, and it stays runnable via workflow_dispatch.
