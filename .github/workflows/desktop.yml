name: Desktop

# CI for the experimental Tauri desktop app (desktop/). The root ci.yml is
# untouched by this surface: desktop/src-tauri is excluded from the cargo
# workspace, so --workspace gates never see it.
on:
  push:
    branches: [main, experiment/desktop]
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "flake.nix"
      - "Cargo.toml"
      - ".github/workflows/desktop.yml"
      - "scripts/verify-desktop-release.sh"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-frontend:
    name: Frontend (typecheck, tests, format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bunx vue-tsc -b
      - run: bun run test
      - run: bun run build

  desktop-rust:
    name: Rust (fmt, clippy, test, bundle)
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: bun install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # CPU-only: the metal feature is deliberately off in CI.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Bundle proof (unsigned .app)
        run: bunx tauri build --bundles app --ci

  desktop-distribution:
    name: Signed + notarized distribution
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    env:
      CARGO_TERM_COLOR: always
      APPLE_SIGNING_IDENTITY: "Developer ID Application: James Brink (28X9H69QGE)"
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop-distribution
      - run: bun install --frozen-lockfile

      - name: Require signing and notarization secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/mold-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"
          echo "MOLD_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple
        run: bunx tauri build --features metal --bundles app,dmg --ci

      - name: Notarize and staple DMG
        working-directory: .
        run: |
          set -euo pipefail
          dmg=$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          scripts/notarize-desktop-dmg.sh "$dmg"

      - name: Verify distribution
        working-directory: .
        run: |
          set -euo pipefail
          app="desktop/src-tauri/target/release/bundle/macos/Mold.app"
          dmg=$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          scripts/verify-desktop-release.sh "$app" "$dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app" desktop/Mold.app.zip

      - uses: actions/upload-artifact@v7
        with:
          name: mold-desktop-${{ github.run_id }}
          path: |
            desktop/Mold.app.zip
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Remove temporary signing keychain
        if: always()
        working-directory: .
        run: |
          if [ -n "${MOLD_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$MOLD_SIGNING_KEYCHAIN" || true
          fi
