name: Desktop

# CI for the experimental Tauri desktop app (desktop/). The root ci.yml is
# untouched by this surface: desktop/src-tauri is excluded from the cargo
# workspace, so --workspace gates never see it.
# These jobs are NOT required status checks, so plain `paths` trigger filters
# are safe here (a filtered-out run reports nothing and blocks nothing) — the
# required checks in ci.yml use job-level `if:` gating instead.
on:
  push:
    branches: [main]
    paths:
      - "desktop/src/*.ts"
      - "desktop/src/*.vue"
      - "desktop/src/assets/**"
      - "desktop/src/components/**"
      - "desktop/src/lib/**"
      - "desktop/src/stores/**"
      - "desktop/src/styles/**"
      - "desktop/src/views/**"
      - "desktop/src-tauri/**"
      - "desktop/.prettierignore"
      - "desktop/icon-master.png"
      - "desktop/index.html"
      - "desktop/package.json"
      - "desktop/tsconfig.json"
      - "desktop/vite.config.ts"
      - "desktop/vitest.config.ts"
      - "studio/**"
      - "ui/**"
      - "package.json"
      - "bun.lock"
      - "bun.nix"
      - "crates/mold-core/**"
      - "crates/mold-catalog/**"
      - "crates/mold-db/**"
      - "crates/mold-candle/**"
      - "crates/mold-inference/**"
      - "crates/mold-scheduler/**"
      - "crates/mold-server/**"
      - "flake.nix"
      - "Cargo.toml"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-distribution.yml"
      - "scripts/check-desktop-nightly-main-head.sh"
      - "scripts/create-desktop-bundle-version.sh"
      - "scripts/create-desktop-dmg.sh"
      - "scripts/create-desktop-nightly-version.sh"
      - "scripts/create-desktop-update-manifest.sh"
      - "scripts/fix-desktop-macos-linkage.sh"
      - "scripts/notarize-desktop-dmg.sh"
      - "scripts/prepare-desktop-linuxdeploy.sh"
      - "scripts/verify-h3-release-exclusion.sh"
      - "scripts/prune-desktop-nightly-assets.sh"
      - "scripts/select-desktop-stable-latest.sh"
      - "scripts/tests/check-desktop-nightly-main-head.sh"
      - "scripts/tests/create-desktop-bundle-version.sh"
      - "scripts/tests/create-desktop-nightly-version.sh"
      - "scripts/tests/create-desktop-update-manifest.sh"
      - "scripts/tests/desktop-dmg-packaging.sh"
      - "scripts/tests/desktop-nightly-race-guards.sh"
      - "scripts/tests/prune-desktop-nightly-assets.sh"
      - "scripts/tests/select-desktop-stable-latest.sh"
      - "scripts/tests/verify-desktop-updater-signature.sh"
      - "scripts/verify-desktop-release.sh"
      - "scripts/verify-desktop-updater-signature.sh"
  pull_request:
  workflow_dispatch:

concurrency:
  # Superseded PR commits cancel within their own PR. Main pushes must remain
  # independent: a multi-hour Linux build from an older commit must never hold
  # the macOS Nightly for the current head in a workflow-level queue. The
  # publication job is serialized separately and fences every upload against
  # the live main SHA.
  group: desktop-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Classify desktop changes
    # release-plz only promotes an already-tested main revision and version
    # metadata. Trust the repository-owned app identity as well as its branch
    # prefix so a user-created branch cannot bypass native PR checks.
    if: >-
      github.event_name != 'pull_request' ||
      github.actor != 'release-plz-mold[bot]' ||
      startsWith(github.head_ref, 'release-plz-') == false ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      rust_format: ${{ steps.filter.outputs.rust_format }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'desktop/src/*.ts'
              - 'desktop/src/*.vue'
              - 'desktop/src/assets/**'
              - 'desktop/src/components/**'
              - 'desktop/src/lib/**'
              - 'desktop/src/stores/**'
              - 'desktop/src/styles/**'
              - 'desktop/src/views/**'
              - 'desktop/.prettierignore'
              - 'desktop/icon-master.png'
              - 'desktop/index.html'
              - 'desktop/package.json'
              - 'desktop/tsconfig.json'
              - 'desktop/vite.config.ts'
              - 'desktop/vitest.config.ts'
              - 'studio/**'
              - 'ui/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.nix'
            rust:
              - 'desktop/src-tauri/**'
              - 'crates/mold-core/**'
              - 'crates/mold-catalog/**'
              - 'crates/mold-db/**'
              - 'crates/mold-candle/**'
              - 'crates/mold-inference/**'
              - 'crates/mold-scheduler/**'
              - 'crates/mold-server/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'flake.nix'
              - 'scripts/verify-h3-release-exclusion.sh'
              - '.github/workflows/desktop.yml'
              - '.github/workflows/desktop-distribution.yml'
            rust_format:
              - 'desktop/src-tauri/**/*.rs'

  desktop-frontend:
    name: Frontend (typecheck, tests, format)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install updater verification tooling
        if: github.event_name == 'push'
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Test updater release scripts
        if: github.event_name == 'push'
        run: |
          bash ../scripts/tests/check-desktop-nightly-main-head.sh
          bash ../scripts/tests/create-desktop-bundle-version.sh
          bash ../scripts/tests/create-desktop-nightly-version.sh
          bash ../scripts/tests/create-desktop-update-manifest.sh
          bash ../scripts/tests/desktop-nightly-race-guards.sh
          bash ../scripts/tests/verify-desktop-updater-signature.sh
          bash ../scripts/tests/prune-desktop-nightly-assets.sh
          bash ../scripts/tests/select-desktop-stable-latest.sh
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run fmt:check
      - run: bun run test
      # `build` already runs vue-tsc before Vite; a separate typecheck compiled
      # the same project twice on every frontend PR.
      - run: bun run build

  desktop-rust:
    name: Native Rust (fmt, clippy, test)
    needs: changes
    if: >-
      github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install protoc
        # The `pulid` feature pulls in `candle-onnx`, whose build script shells
        # out to `protoc`. It ships in every desktop recipe (#1223).
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # CPU-only: the metal feature is deliberately off in CI.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # `pulid` is in every shipped desktop recipe, so its lints must compile
      # here rather than first on a release runner.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features pulid -- -D warnings

  desktop-linux:
    name: Linux (clippy, test; main AppImage)
    needs: changes
    # Native PR feedback runs on macOS above. Main adds the stronger CUDA
    # AppImage build and launch without duplicating it on every PR revision.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    env:
      CUDA_COMPUTE_CAP: "89"
      LIBRARY_PATH: /usr/local/cuda/lib64/stubs
      XDG_CACHE_HOME: /tmp/mold-desktop-cache-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          # `protobuf-compiler` is for the `pulid` feature: `candle-onnx`'s
          # build script drives `prost-build`, which shells out to `protoc`.
          sudo apt-get install -y \
            build-essential clang lld nasm pkg-config protobuf-compiler \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Install AppImage smoke dependencies
        if: github.event_name == 'push'
        run: |
          sudo apt-get install -y \
            patchelf file wget curl xdg-utils xvfb xdotool openbox dbus-x11 imagemagick libfuse2 \
            gstreamer1.0-libav gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - name: Install CUDA toolkit for AppImage
        if: github.event_name == 'push'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: local
          log-file-suffix: desktop-sm89
          linux-local-args: '["--toolkit"]'
          use-github-cache: false
          use-local-cache: false
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop-linux-sm89
          cache-on-failure: true
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features pulid -- -D warnings
      - if: github.event_name == 'push'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features h3-cuda,pulid -- -D warnings
      - name: Prepare linuxdeploy and the CI driver stub
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          driver_stub_dir="$RUNNER_TEMP/mold-smoke-driver"
          mkdir -p "$driver_stub_dir"
          ln -sf /usr/local/cuda/lib64/stubs/libcuda.so "$driver_stub_dir/libcuda.so.1"
          echo "LD_LIBRARY_PATH=$driver_stub_dir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          ../scripts/prepare-desktop-linuxdeploy.sh
      - name: Build optimized CUDA AppImage
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          bunx tauri build --features h3-cuda,pulid --bundles appimage --ci -v
      - name: Verify bundled CUDA libraries
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          test -n "$appimage"
          extract_dir=$(mktemp -d)
          appimage=$(realpath "$appimage")
          (cd "$extract_dir" && "$appimage" --appimage-extract >/dev/null)
          root="$extract_dir/squashfs-root"

          desktop_binary=$(find "$root" -type f -name mold-desktop -perm -u+x -print -quit)
          test -n "$desktop_binary"
          ../scripts/verify-h3-release-exclusion.sh "$desktop_binary"

          if find "$root" -name 'libcuda.so*' -print -quit | grep -q .; then
            echo "unexpected bundled NVIDIA driver" >&2
            exit 1
          fi
          for library in 'libcurand.so*' 'libcublas.so*' 'libcublasLt.so*'; do
            if ! find "$root" -name "$library" -print -quit | grep -q .; then
              echo "missing bundled $library" >&2
              exit 1
            fi
          done
          rm -rf "$extract_dir"
      - name: Launch AppImage under Xvfb
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          test -n "$appimage"
          chmod +x "$appimage"
          xvfb-run -a dbus-run-session -- bash -s -- "$appimage" <<'EOF'
          set -euo pipefail
          appimage=$1
          screenshot=src-tauri/target/mold-appimage-smoke.png
          body=src-tauri/target/mold-appimage-smoke-body.png

          openbox >/tmp/mold-openbox.log 2>&1 &
          wm_pid=$!
          sleep 1
          env WEBKIT_DISABLE_COMPOSITING_MODE=1 "$appimage" --appimage-extract-and-run &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            kill "$wm_pid" 2>/dev/null || true
            wait "$wm_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          window=
          rendered=0
          for _ in $(seq 1 30); do
            kill -0 "$pid"
            window=$(xdotool search --onlyvisible --pid "$pid" 2>/dev/null | head -n 1 || true)
            if [[ -z "$window" ]]; then
              window=$(xdotool search --onlyvisible --name '.' 2>/dev/null | head -n 1 || true)
            fi
            if [[ -n "$window" ]]; then
              if import -window "$window" "$screenshot" && \
                convert "$screenshot" -gravity south -crop '100%x95%+0+0' +repage "$body"; then
                rendered=$(identify -format '%[fx:standard_deviation>0.03]' "$body")
                if [[ "$rendered" == 1 ]]; then
                  break
                fi
              fi
            fi
            sleep 1
          done

          test -n "$window"
          test "$rendered" = 1
          EOF
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && always()
        with:
          name: mold-desktop-linux-smoke
          path: desktop/src-tauri/target/mold-appimage-smoke.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: mold-desktop-linux-appimage-sm89
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Build the signed candidate in parallel with frontend/Rust validation, then
  # gate only publication on all three. The distribution build compiles the
  # same frontend and Rust application itself, so serializing it behind those
  # checks only added latency without improving the shipped artifact.
  desktop-nightly:
    name: Build nightly distribution
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes]
    uses: ./.github/workflows/desktop-distribution.yml
    with:
      channel: nightly
    secrets: inherit

  publish-desktop-nightly:
    name: Publish nightly update
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [desktop-nightly, desktop-frontend, desktop-rust]
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-nightly-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install updater verification tooling
        run: sudo apt-get update && sudo apt-get install -y minisign
      - uses: actions/download-artifact@v8
        with:
          name: mold-desktop-macos-nightly
          path: artifacts

      - name: Upload immutable nightly payloads
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.desktop-nightly.outputs.version }}
          UPDATER_ARTIFACT_NAME: ${{ needs.desktop-nightly.outputs.updater_artifact_name }}
          DMG_NAME: ${{ needs.desktop-nightly.outputs.dmg_name }}
          MANIFEST_NAME: ${{ needs.desktop-nightly.outputs.manifest_name }}
        run: |
          set -euo pipefail
          payload="artifacts/$UPDATER_ARTIFACT_NAME"
          signature="$payload.sig"
          dmg="artifacts/$DMG_NAME"
          manifest="artifacts/$MANIFEST_NAME"
          for path in "$payload" "$signature" "$dmg" "$manifest"; do
            if [[ ! -f "$path" ]]; then
              echo "::error::missing nightly artifact $path"
              exit 1
            fi
          done

          if scripts/check-desktop-nightly-main-head.sh "$GITHUB_SHA"; then
            :
          else
            head_status=$?
            if [[ "$head_status" -eq 10 ]]; then
              echo "::notice::Skipping stale desktop nightly $VERSION; main advanced during the build."
              exit 0
            fi
            exit "$head_status"
          fi

          scripts/verify-desktop-updater-signature.sh \
            --artifact "$payload" \
            --signature "$signature" \
            --config desktop/src-tauri/tauri.conf.json

          # release.yml normally owns this rolling prerelease. Handle the first
          # run (or a race with that workflow) without changing its body later.
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Latest Build" \
              --notes "Rolling pre-release from main." \
              --prerelease \
              || gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null
          fi

          # The manifest is the channel pointer, so publish and prove every
          # version-unique target before changing that pointer.
          gh release upload latest "$payload" "$signature" "$dmg" \
            --repo "$GITHUB_REPOSITORY" --clobber

          payload_url=$(jq -r '.platforms["darwin-aarch64"].url' "$manifest")
          expected_sha=$(sha256sum "$payload" | awk '{print $1}')
          remote_payload="$RUNNER_TEMP/$UPDATER_ARTIFACT_NAME"
          payload_ready=false
          for attempt in $(seq 1 20); do
            if curl -fsSL "$payload_url" -o "$remote_payload"; then
              actual_sha=$(sha256sum "$remote_payload" | awk '{print $1}')
              if [[ "$actual_sha" == "$expected_sha" ]]; then
                payload_ready=true
                break
              fi
            fi
            if [[ "$attempt" -lt 20 ]]; then
              echo "Nightly payload not anonymously available yet (attempt $attempt/20); retrying in 15s"
              sleep 15
            fi
          done
          if [[ "$payload_ready" != true ]]; then
            echo "::error::nightly updater payload failed anonymous SHA-256 verification"
            exit 1
          fi

          # Main can advance while the immutable payload is propagating. Check
          # again at the channel-pointer boundary so a stale build cannot flip
          # the manifest after a newer primary run has started.
          if scripts/check-desktop-nightly-main-head.sh "$GITHUB_SHA"; then
            :
          else
            head_status=$?
            if [[ "$head_status" -eq 10 ]]; then
              echo "::notice::Leaving verified stale payload $VERSION unpublished; main advanced before the manifest flip."
              exit 0
            fi
            exit "$head_status"
          fi

          gh release upload latest "$manifest" \
            --repo "$GITHUB_REPOSITORY" --clobber

          manifest_url="https://github.com/$GITHUB_REPOSITORY/releases/download/latest/$MANIFEST_NAME"
          expected_signature=$(tr -d '\r\n' < "$signature")
          remote_manifest="$RUNNER_TEMP/$MANIFEST_NAME"
          manifest_ready=false
          for attempt in $(seq 1 20); do
            if curl -fsSL "$manifest_url" -o "$remote_manifest" \
              && jq -e \
                --arg version "$VERSION" \
                --arg url "$payload_url" \
                --arg signature "$expected_signature" \
                '.version == $version
                  and .platforms["darwin-aarch64"].url == $url
                  and .platforms["darwin-aarch64"].signature == $signature' \
                "$remote_manifest" > /dev/null; then
              manifest_ready=true
              break
            fi
            if [[ "$attempt" -lt 20 ]]; then
              echo "Nightly manifest not anonymously available yet (attempt $attempt/20); retrying in 15s"
              sleep 15
            fi
          done
          if [[ "$manifest_ready" != true ]]; then
            echo "::error::nightly updater manifest failed anonymous verification"
            exit 1
          fi

          # The manifest now points at a fully verified immutable payload. Only
          # after that atomic flip is it safe to remove older generations.
          scripts/prune-desktop-nightly-assets.sh \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag latest \
            --current-version "$VERSION" \
            --keep 10

          echo "Published Mold desktop nightly $VERSION"
          echo "Manifest: $manifest_url"
