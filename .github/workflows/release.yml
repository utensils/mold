name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-14
    env:
      CARGO_INCREMENTAL: "1"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.7

      - name: Probe sccache (disable on cache outage)
        shell: bash
        run: |
          # Mirror the CI probe in ci.yml: actually compile a tiny program through sccache
          # so we exercise the GHA cache backend, not just the local daemon. Outages there
          # surface only on first read — `sccache --start-server` alone won't catch them.
          set +e
          printf 'fn main() {}\n' > /tmp/sccache_probe.rs
          sccache rustc --edition 2021 -- /tmp/sccache_probe.rs -o /tmp/sccache_probe
          status=$?
          rm -f /tmp/sccache_probe /tmp/sccache_probe.rs
          if [ $status -ne 0 ]; then
            echo "::warning::sccache probe failed (likely GHA cache outage); falling back to direct rustc"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            sccache --stop-server >/dev/null 2>&1 || true
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release
          cache-on-failure: true

      - name: Build (Metal)
        run: cargo build --release -p mold-ai --features metal,preview,discord,expand,tui,webp,mp4,metrics

      - name: Ad-hoc code sign
        run: codesign -s - target/release/mold

      - name: Package
        run: tar -czf mold-aarch64-apple-darwin.tar.gz -C target/release mold

      - uses: actions/upload-artifact@v7
        with:
          name: mold-aarch64-apple-darwin
          path: mold-aarch64-apple-darwin.tar.gz

  # Ada Lovelace (RTX 40-series, sm_89)
  build-linux-sm89:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "1"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y clang lld nasm

      - uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: local
          log-file-suffix: sm89

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.7

      - name: Probe sccache (disable on cache outage)
        shell: bash
        run: |
          # Mirror the CI probe in ci.yml: actually compile a tiny program through sccache
          # so we exercise the GHA cache backend, not just the local daemon. Outages there
          # surface only on first read — `sccache --start-server` alone won't catch them.
          set +e
          printf 'fn main() {}\n' > /tmp/sccache_probe.rs
          sccache rustc --edition 2021 -- /tmp/sccache_probe.rs -o /tmp/sccache_probe
          status=$?
          rm -f /tmp/sccache_probe /tmp/sccache_probe.rs
          if [ $status -ne 0 ]; then
            echo "::warning::sccache probe failed (likely GHA cache outage); falling back to direct rustc"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            sccache --stop-server >/dev/null 2>&1 || true
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-cuda-sm89-release
          cache-on-failure: true

      - name: Build (CUDA sm_89)
        env:
          CUDA_COMPUTE_CAP: "89"
          LIBRARY_PATH: /usr/local/cuda/lib64/stubs
        run: cargo build --release -p mold-ai --features cuda,preview,discord,expand,tui,webp,mp4,metrics

      - name: Package
        run: tar -czf mold-x86_64-unknown-linux-gnu-cuda-sm89.tar.gz -C target/release mold

      - uses: actions/upload-artifact@v7
        with:
          name: mold-x86_64-unknown-linux-gnu-cuda-sm89
          path: mold-x86_64-unknown-linux-gnu-cuda-sm89.tar.gz

  # Blackwell (RTX 50-series, sm_120)
  build-linux-sm120:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "1"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y clang lld nasm

      - uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: local
          log-file-suffix: sm120

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.7

      - name: Probe sccache (disable on cache outage)
        shell: bash
        run: |
          # Mirror the CI probe in ci.yml: actually compile a tiny program through sccache
          # so we exercise the GHA cache backend, not just the local daemon. Outages there
          # surface only on first read — `sccache --start-server` alone won't catch them.
          set +e
          printf 'fn main() {}\n' > /tmp/sccache_probe.rs
          sccache rustc --edition 2021 -- /tmp/sccache_probe.rs -o /tmp/sccache_probe
          status=$?
          rm -f /tmp/sccache_probe /tmp/sccache_probe.rs
          if [ $status -ne 0 ]; then
            echo "::warning::sccache probe failed (likely GHA cache outage); falling back to direct rustc"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            sccache --stop-server >/dev/null 2>&1 || true
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-cuda-sm120-release
          cache-on-failure: true

      - name: Build (CUDA sm_120)
        env:
          CUDA_COMPUTE_CAP: "120"
          LIBRARY_PATH: /usr/local/cuda/lib64/stubs
        run: cargo build --release -p mold-ai --features cuda,preview,discord,expand,tui,webp,mp4,metrics

      - name: Package
        run: tar -czf mold-x86_64-unknown-linux-gnu-cuda-sm120.tar.gz -C target/release mold

      - uses: actions/upload-artifact@v7
        with:
          name: mold-x86_64-unknown-linux-gnu-cuda-sm120
          path: mold-x86_64-unknown-linux-gnu-cuda-sm120.tar.gz

  # Docker image — build and push to GHCR
  # Tags: `latest` on main, `v1.2.3` + `latest` on version tags
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - cuda_cap: "89"
            suffix: ""
            tag_suffix: ""
          - cuda_cap: "80"
            suffix: "-sm80"
            tag_suffix: "-sm80"
          - cuda_cap: "90"
            suffix: "-sm90"
            tag_suffix: "-sm90"
          - cuda_cap: "120"
            suffix: "-sm120"
            tag_suffix: "-sm120"
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_COMPUTE_CAP=${{ matrix.cuda_cap }}
          cache-from: type=gha,scope=docker${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker${{ matrix.suffix }}

  # Rolling pre-release on every push to main
  release-latest:
    if: github.ref == 'refs/heads/main'
    needs: [build-macos, build-linux-sm89, build-linux-sm120]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: cd artifacts && sha256sum *.tar.gz > SHA256SUMS

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          files: |
            artifacts/mold-aarch64-apple-darwin.tar.gz
            artifacts/mold-x86_64-unknown-linux-gnu-cuda-sm89.tar.gz
            artifacts/mold-x86_64-unknown-linux-gnu-cuda-sm120.tar.gz
            artifacts/SHA256SUMS
          body: |
            Rolling pre-release — updated on every push to `main`.

            **Commit:** ${{ github.sha }}

            ## Download

            | Platform | GPU | File |
            |----------|-----|------|
            | macOS Apple Silicon | Metal | `mold-aarch64-apple-darwin.tar.gz` |
            | Linux x86_64 | CUDA — RTX 40-series (Ada Lovelace) | `mold-x86_64-unknown-linux-gnu-cuda-sm89.tar.gz` |
            | Linux x86_64 | CUDA — RTX 50-series (Blackwell) | `mold-x86_64-unknown-linux-gnu-cuda-sm120.tar.gz` |

            The install script auto-detects your GPU:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/utensils/mold/main/install.sh | sh
            ```

            Manual install:
            ```bash
            # macOS
            tar xzf mold-aarch64-apple-darwin.tar.gz
            xattr -d com.apple.quarantine mold  # if needed
            ./mold version

            # Linux (requires NVIDIA driver + CUDA runtime)
            tar xzf mold-x86_64-unknown-linux-gnu-cuda-sm89.tar.gz   # RTX 40-series
            tar xzf mold-x86_64-unknown-linux-gnu-cuda-sm120.tar.gz  # RTX 50-series
            ./mold version
            ```

  # Versioned release + crates.io publish on v* tags
  release-version:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux-sm89, build-linux-sm120]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: cd artifacts && sha256sum *.tar.gz > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          make_latest: true
          files: |
            artifacts/mold-aarch64-apple-darwin.tar.gz
            artifacts/mold-x86_64-unknown-linux-gnu-cuda-sm89.tar.gz
            artifacts/mold-x86_64-unknown-linux-gnu-cuda-sm120.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            # One-line install (auto-detects GPU, pinned to this release)
            curl -fsSL https://raw.githubusercontent.com/utensils/mold/${{ github.ref_name }}/install.sh | MOLD_VERSION=${{ github.ref_name }} sh

            # From crates.io (CPU-only, no GPU acceleration)
            cargo install mold-ai

            # From source with GPU support
            cargo install --git https://github.com/utensils/mold --tag ${{ github.ref_name }} --features metal,preview,discord,expand,tui,webp,mp4,metrics  # macOS
            cargo install --git https://github.com/utensils/mold --tag ${{ github.ref_name }} --features cuda,preview,discord,expand,tui,webp,mp4,metrics   # Linux

            # Nix
            nix run github:utensils/mold/${{ github.ref_name }}
            ```

            ## Download pre-built binaries

            | Platform | GPU | File |
            |----------|-----|------|
            | macOS Apple Silicon | Metal | `mold-aarch64-apple-darwin.tar.gz` |
            | Linux x86_64 | CUDA — RTX 40-series (Ada) | `mold-x86_64-unknown-linux-gnu-cuda-sm89.tar.gz` |
            | Linux x86_64 | CUDA — RTX 50-series (Blackwell) | `mold-x86_64-unknown-linux-gnu-cuda-sm120.tar.gz` |

  # Publish to crates.io on v* tags
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish mold-ai-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p mold-ai-core

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish mold-ai-db
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p mold-ai-db

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish mold-ai-catalog
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p mold-ai-catalog

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish mold-ai-inference
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p mold-ai-inference

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish mold-ai-discord
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p mold-ai-discord

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish mold-ai-server
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p mold-ai-server

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish mold-ai-tui
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p mold-ai-tui

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish mold-ai
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p mold-ai

  # Publish to the AUR on v* tags. Matrix excludes mold-ai-git (tracks
  # main HEAD; hand-bumped only). Each entry rewrites pkgver +
  # sha256sums against the new tag, regenerates .SRCINFO inside an Arch
  # container, and pushes to ssh://aur@aur.archlinux.org/<pkgname>.git.
  publish-aur:
    name: Publish AUR (${{ matrix.pkgname }})
    needs: [release-version]
    # Fires on `v*` tag pushes. Manually re-running the workflow on a
    # past tag (via "Re-run jobs" in the UI) preserves the tag ref so
    # this job re-evaluates, BUT `allow_empty_commits: false` in the
    # deploy step below makes that a no-op when the PKGBUILD content
    # hasn't changed. A re-run after a tag force-push with new content
    # will produce a new commit — which is the intended escape hatch
    # for releasing a hotfix to the same tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkgname: [mold-ai-bin, mold-ai]
    steps:
      # Bail out cleanly when AUR_SSH_PRIVATE_KEY hasn't been set. The
      # one-time bootstrap (registering the AUR account's SSH key +
      # seeding each pkgname's AUR git repo) happens outside CI; until
      # that's done, the deploy action would fail with a confusing
      # "Permission denied (publickey)" and turn the release red.
      - name: Gate on AUR_SSH_PRIVATE_KEY
        id: gate-secret
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "AUR_SSH_PRIVATE_KEY secret is not set — skipping AUR publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate-secret.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Refresh PKGBUILD with release checksums
        if: steps.gate-secret.outputs.skip != 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          scripts/aur/update-pkgbuild.sh "${{ matrix.pkgname }}" "$VERSION"

      # The deploy action runs in an Arch container, regenerates
      # .SRCINFO with `makepkg --printsrcinfo`, commits, and pushes
      # over SSH. `allow_empty_commits: false` keeps re-runs against
      # an unchanged PKGBUILD from spamming the AUR git log.
      - name: Publish to AUR
        if: steps.gate-secret.outputs.skip != 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: ${{ matrix.pkgname }}
          pkgbuild: packaging/aur/${{ matrix.pkgname }}/PKGBUILD
          commit_username: "mold Release Bot"
          commit_email: "brink.james@gmail.com"
          commit_message: "Update to ${{ github.ref_name }}"
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          # AUR's git server presents RSA + ed25519 host keys; scan
          # both so we are resilient if either rotates.
          ssh_keyscan_types: "rsa,ed25519"
          allow_empty_commits: false
