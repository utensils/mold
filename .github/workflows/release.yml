  # Evaluate and build every new public Nix output on a hosted runner. This is
  # intentionally a real build gate, not a source grep or dry-run.
  build-nix-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - uses: cachix/install-nix-action@v31

      - name: Build sm86, sm100, and Linux desktop sm86 outputs
        run: nix build .#mold-sm86 .#mold-sm100 .#mold-desktop-sm86 --no-link

  # Signed + notarized stable desktop app and Tauri updater payload — tags only.
  # Main-branch desktop nightlies are gated and published by desktop.yml.
  build-desktop-dmg:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/desktop-distribution.yml
    with:
      channel: stable
    secrets: inherit

  # Docker images — main publishes the mutable rolling latest* map; v* jobs
  # create-once/verify semver aliases and export exact digest fragments.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - cuda_cap: "89"
            suffix: ""
            target: "sm89"
          - cuda_cap: "80"
            suffix: "-sm80"
            target: "sm80"
          - cuda_cap: "86"
            suffix: "-sm86"
            target: "sm86"
          - cuda_cap: "90"
            suffix: "-sm90"
            target: "sm90"
          - cuda_cap: "100"
            suffix: "-sm100"
            target: "sm100"
          - cuda_cap: "120"
            suffix: "-sm120"
            target: "sm120"
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest${{ matrix.suffix }},enable={{is_default_branch}}
            type=raw,value=sha-${{ github.sha }}${{ matrix.suffix }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_COMPUTE_CAP=${{ matrix.cuda_cap }}
            MOLD_DISTRIBUTION_IMAGE_VERSION=${{ env.MOLD_DISTRIBUTION_IMAGE_VERSION }}
            MOLD_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docker${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker${{ matrix.suffix }}

      - name: Verify built container source identity
        env:
          BUILT_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$BUILT_IMAGE"
          # A GitHub-hosted runner has no NVIDIA driver injection. The CUDA
          # runtime image includes the forward-compatibility driver library,
          # but its compat directory is intentionally not the normal runtime
          # loader path. Expose it only for this GPU-less identity smoke.
          version="$(
            docker run --rm \
              --entrypoint /bin/sh \
              -e LD_LIBRARY_PATH=/usr/local/cuda/compat:/usr/local/cuda/lib64 \
              "$BUILT_IMAGE" \
              -c 'exec mold version'
          )"
          grep -Fq "$GITHUB_SHA" <<<"$version" || {
            echo "::error::container does not report exact source SHA $GITHUB_SHA: $version"
            exit 1
          }

      - name: Create once and verify immutable stable tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          SUFFIX: ${{ matrix.suffix }}
          REPOSITORY: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          target="$REPOSITORY:${VERSION#v}$SUFFIX"
          inspect_digest() {
            docker buildx imagetools inspect "$1" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null \
              | tr -d '"'
          }
          existing="$(inspect_digest "$target" || true)"
          if [[ -n "$existing" && "$existing" != "$BUILT_DIGEST" ]]; then
            echo "::error::immutable stable container tag already points at $existing, not $BUILT_DIGEST: $target"
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$target" \
              "$REPOSITORY@$BUILT_DIGEST"
          fi
          verified="$(inspect_digest "$target")"
          if [[ "$verified" != "$BUILT_DIGEST" ]]; then
            echo "::error::stable container digest verification failed for $target"
            exit 1
          fi

      - name: Record exact stable target digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          jq -n \
            --arg target "$TARGET" \
            --arg tag "${VERSION#v}$SUFFIX" \
            --arg digest "$DIGEST" \
            '{target: $target, tag: $tag, digest: $digest}' \
            > "container-digest-$TARGET.json"

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: container-digest-${{ matrix.target }}
          path: container-digest-${{ matrix.target }}.json

  # Rolling pre-release on every push to main
  release-latest:
    if: github.ref == 'refs/heads/main'
    needs: [build-macos, build-linux-sm86, build-linux-sm89, build-linux-sm100, build-linux-sm120, build-nix-distribution, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: cd artifacts && sha256sum ./*.tar.gz > SHA256SUMS

      - name: Verify rolling release source is current main
        run: scripts/check-desktop-nightly-main-head.sh "$GITHUB_SHA"

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          files: |
            artifacts/mold-aarch64-apple-darwin.tar.gz
            artifacts/mold-x86_64-unknown-linux-gnu-cuda-sm86.tar.gz
            artifacts/mold-x86_64-unknown-linux-gnu-cuda-sm89.tar.gz
            artifacts/mold-x86_64-unknown-linux-gnu-cuda-sm100.tar.gz
            artifacts/mold-x86_64-unknown-linux-gnu-cuda-sm120.tar.gz
            artifacts/SHA256SUMS
          body: |
            Rolling pre-release — updated on every push to `main`.

            **Commit:** ${{ github.sha }}

            ## Download

            | Platform | GPU | File |
            |----------|-----|------|
            | macOS Apple Silicon | Metal | `mold-aarch64-apple-darwin.tar.gz` |
            | Linux x86_64 | CUDA — RTX 3090 / A40 (Ampere) | `mold-x86_64-unknown-linux-gnu-cuda-sm86.tar.gz` |
            | Linux x86_64 | CUDA — RTX 40-series (Ada Lovelace) | `mold-x86_64-unknown-linux-gnu-cuda-sm89.tar.gz` |
            | Linux x86_64 | CUDA — B200 / B300 (datacenter Blackwell; simulated, not hardware-qualified) | `mold-x86_64-unknown-linux-gnu-cuda-sm100.tar.gz` |
            | Linux x86_64 | CUDA — RTX 50-series (consumer Blackwell) | `mold-x86_64-unknown-linux-gnu-cuda-sm120.tar.gz` |

            GH200, GB200, and GB300 require future linux/arm64 artifacts and are unsupported.
            Current Linux release archives and container images are linux/amd64 only.

            The install script auto-detects your GPU:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/utensils/mold/main/install.sh | sh
            ```

            Manual install:
            ```bash
            # macOS
            tar xzf mold-aarch64-apple-darwin.tar.gz
            xattr -d com.apple.quarantine mold  # if needed
            ./mold version

            # Linux (requires NVIDIA driver + CUDA runtime)
            tar xzf mold-x86_64-unknown-linux-gnu-cuda-sm86.tar.gz   # RTX 3090 / A40
            tar xzf mold-x86_64-unknown-linux-gnu-cuda-sm89.tar.gz   # RTX 40-series
            tar xzf mold-x86_64-unknown-linux-gnu-cuda-sm100.tar.gz  # B200 / B300 (simulated)
            tar xzf mold-x86_64-unknown-linux-gnu-cuda-sm120.tar.gz  # RTX 50-series
            ./mold version
            ```

      # action-gh-release updates an existing release's body and assets, but it
      # does not move the already-created tag. Keep the mutable rolling tag as
      # exact as the commit recorded in the release body and shipped binaries.
      - name: Pin rolling tag to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          scripts/check-desktop-nightly-main-head.sh "$GITHUB_SHA"

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
            -f "sha=${GITHUB_SHA}" \
            -F force=true >/dev/null

          tag_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" \
              --jq '.object.sha'
          )"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::latest resolved to $tag_sha instead of $GITHUB_SHA"
            exit 1
          fi

  # Versioned release + crates.io publish on v* tags
  release-version:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux-sm86, build-linux-sm89, build-linux-sm100, build-linux-sm120, build-nix-distribution, build-desktop-dmg, docker]
    runs-on: ubuntu-latest
    concurrency:
      group: stable-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Install updater verification tooling
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Verify desktop updater signature
        run: |
          set -euo pipefail
          payload=$(find artifacts -maxdepth 1 -name 'Mold_*_aarch64.app.tar.gz' -print -quit)
          if [[ -z "$payload" || ! -f "$payload.sig" ]]; then
            echo "::error::stable updater payload or signature is missing"
            exit 1
          fi
          scripts/verify-desktop-updater-signature.sh \
            --artifact "$payload" \
            --signature "$payload.sig" \
            --config desktop/src-tauri/tauri.conf.json

      - name: Protect the stable channel pointer
        id: stable-pointer
        env:
          CANDIDATE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="${CANDIDATE_TAG#v}"
          latest_json="$RUNNER_TEMP/current-latest-release.json"
          http_status=$(curl --silent --show-error --location \
            --output "$latest_json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest")

          case "$http_status" in
            200)
              current_tag=$(jq -er '.tag_name' "$latest_json")
              current="${current_tag#v}"
              make_latest=$(scripts/select-desktop-stable-latest.sh "$candidate" "$current")
              ;;
            404)
              current_tag=""
              make_latest=true
              ;;
            *)
              echo "::error::GitHub latest-release lookup returned HTTP $http_status"
              exit 1
              ;;
          esac

          {
            echo "make_latest=$make_latest"
            echo "current_tag=$current_tag"
          } >> "$GITHUB_OUTPUT"

          if [[ "$make_latest" == true ]]; then
            echo "Stable $CANDIDATE_TAG may advance releases/latest (current: ${current_tag:-none})."
          else
            echo "::notice::Publishing older stable $CANDIDATE_TAG without moving releases/latest from $current_tag."
          fi

      # The website links to releases/latest/download/Mold-macos-arm64.dmg, so
      # every release must carry the DMG under that stable name alongside the
      # versioned Mold_x.y.z_aarch64.dmg.
      - name: Stable-named desktop DMG
        run: cp artifacts/Mold_*_aarch64.dmg artifacts/Mold-macos-arm64.dmg

      - name: Generate checksums
        run: cd artifacts && sha256sum ./*.tar.gz ./*.dmg ./*.zip > SHA256SUMS

      - name: Generate exact container digest manifest and release provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          scripts/create-container-digest-manifest.sh \
            artifacts/mold-container-digests.json \
            "ghcr.io/$GITHUB_REPOSITORY" \
            "$RELEASE_TAG" \
            "$SOURCE_SHA" \
            artifacts/container-digest-*.json
          (
            cd artifacts
            sha256sum mold-container-digests.json >> SHA256SUMS
          )
          scripts/create-release-provenance.sh \
            artifacts/mold-release-provenance.json \
            "$RELEASE_TAG" \
            "$SOURCE_SHA" \
            artifacts/SHA256SUMS \
            artifacts
          # Provenance is derived from the artifact-only checksum set above.
          # Append its digest afterwards so SHA256SUMS binds the exact manifest
          # without creating a circular provenance/checksum dependency.
          (
            cd artifacts
            sha256sum mold-release-provenance.json >> SHA256SUMS
          )

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          make_latest: ${{ steps.stable-pointer.outputs.make_latest }}
          files: |
            artifacts/mold-aarch64-apple-darwin.tar.gz
            artifacts/mold-x86_64-unknown-linux-gnu-cuda-sm86.tar.gz
            artifacts/mold-x86_64-unknown-linux-gnu-cuda-sm89.tar.gz
            artifacts/mold-x86_64-unknown-linux-gnu-cuda-sm100.tar.gz
            artifacts/mold-x86_64-unknown-linux-gnu-cuda-sm120.tar.gz
            artifacts/*.dmg
            artifacts/Mold.app.zip
            artifacts/Mold_*_aarch64.app.tar.gz
            artifacts/Mold_*_aarch64.app.tar.gz.sig
            artifacts/mold-desktop-stable.json
            artifacts/mold-release-provenance.json
            artifacts/mold-container-digests.json
            artifacts/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            # One-line install (auto-detects GPU, pinned to this release)
            curl -fsSL https://raw.githubusercontent.com/utensils/mold/${{ github.ref_name }}/install.sh | MOLD_VERSION=${{ github.ref_name }} sh

            # From crates.io (CPU-only, no GPU acceleration)
            cargo install mold-ai

            # From source with GPU support
            cargo install --git https://github.com/utensils/mold --tag ${{ github.ref_name }} --features metal,preview,discord,expand,tui,webp,mp4,metrics,mdns  # macOS
            cargo install --git https://github.com/utensils/mold --tag ${{ github.ref_name }} --features cuda,preview,discord,expand,tui,webp,mp4,metrics,mdns   # Linux

            # Nix
            nix run github:utensils/mold/${{ github.ref_name }}
            ```

            ## Download pre-built binaries

            | Platform | GPU | File |
            |----------|-----|------|
            | macOS Apple Silicon | Metal | `mold-aarch64-apple-darwin.tar.gz` |
            | Linux x86_64 | CUDA — RTX 3090 / A40 (Ampere) | `mold-x86_64-unknown-linux-gnu-cuda-sm86.tar.gz` |
            | Linux x86_64 | CUDA — RTX 40-series (Ada) | `mold-x86_64-unknown-linux-gnu-cuda-sm89.tar.gz` |
            | Linux x86_64 | CUDA — B200 / B300 (datacenter Blackwell; simulated, not hardware-qualified) | `mold-x86_64-unknown-linux-gnu-cuda-sm100.tar.gz` |
            | Linux x86_64 | CUDA — RTX 50-series (consumer Blackwell) | `mold-x86_64-unknown-linux-gnu-cuda-sm120.tar.gz` |

            GH200, GB200, and GB300 require future linux/arm64 artifacts and are unsupported.
            Current Linux release archives and container images are linux/amd64 only.

            ## Desktop app (macOS)

            `Mold-macos-arm64.dmg` (also attached with its versioned name) — signed, notarized, and stapled. Drag Mold to Applications; no quarantine dance needed. Stable link to the newest build: https://github.com/utensils/mold/releases/latest/download/Mold-macos-arm64.dmg

      - name: Verify public stable updater manifest
        env:
          VERSION: ${{ github.ref_name }}
          MAKE_LATEST: ${{ steps.stable-pointer.outputs.make_latest }}
          PREVIOUS_LATEST_TAG: ${{ steps.stable-pointer.outputs.current_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `release_version`, not `version`: shellcheck cannot see the `env:`
          # block above, so a lowercase twin of `VERSION` reads to it as a
          # misspelling (SC2153) and fails the actionlint contract.
          release_version="${VERSION#v}"
          local_manifest="artifacts/mold-desktop-stable.json"
          signature_path=$(find artifacts -maxdepth 1 -name 'Mold_*_aarch64.app.tar.gz.sig' -print -quit)
          if [[ ! -f "$local_manifest" || -z "$signature_path" ]]; then
            echo "::error::stable updater manifest or signature is missing"
            exit 1
          fi

          payload_url=$(jq -r '.platforms["darwin-aarch64"].url' "$local_manifest")
          expected_signature=$(tr -d '\r\n' < "$signature_path")
          if [[ "$MAKE_LATEST" == true ]]; then
            manifest_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/mold-desktop-stable.json"
          else
            latest_tag=$(curl -fsSL \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest" \
              | jq -er '.tag_name')
            if [[ "$latest_tag" != "$PREVIOUS_LATEST_TAG" ]]; then
              echo "::error::older stable publication moved releases/latest from $PREVIOUS_LATEST_TAG to $latest_tag"
              exit 1
            fi
            manifest_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/mold-desktop-stable.json"
          fi
          remote_manifest="$RUNNER_TEMP/mold-desktop-stable.json"
          ready=false
          for attempt in $(seq 1 20); do
            if curl -fsSL "$manifest_url" -o "$remote_manifest" \
              && jq -e \
                --arg version "$release_version" \
                --arg url "$payload_url" \
                --arg signature "$expected_signature" \
                '.version == $version
                  and .platforms["darwin-aarch64"].url == $url
                  and .platforms["darwin-aarch64"].signature == $signature' \
                "$remote_manifest" > /dev/null \
              && curl -fsIL "$payload_url" > /dev/null; then
              ready=true
              break
            fi
            if [[ "$attempt" -lt 20 ]]; then
              echo "Stable updater assets not anonymously available yet (attempt $attempt/20); retrying in 15s"
              sleep 15
            fi
          done
          if [[ "$ready" != true ]]; then
            echo "::error::stable updater manifest failed anonymous verification"
            exit 1
          fi
          echo "Verified stable updater manifest: $manifest_url"

  # Publish to crates.io on v* tags
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/release/publish-crates.sh

  # Publish to the AUR on v* tags. Matrix excludes mold-ai-git (tracks
  # main HEAD; hand-bumped only). Each entry rewrites pkgver +
  # sha256sums against the new tag, regenerates .SRCINFO inside an Arch
  # container, and pushes to ssh://aur@aur.archlinux.org/<pkgname>.git.
  publish-aur:
    name: Publish AUR (${{ matrix.pkgname }})
    needs: [release-version]
    # Fires on `v*` tag pushes. Manually re-running the workflow on a
    # past tag (via "Re-run jobs" in the UI) preserves the tag ref so
    # this job re-evaluates, BUT `allow_empty_commits: false` in the
    # deploy step below makes that a no-op when the PKGBUILD content
    # hasn't changed. A re-run after a tag force-push with new content
    # will produce a new commit — which is the intended escape hatch
    # for releasing a hotfix to the same tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkgname: [mold-ai-bin, mold-ai]
    steps:
      # Bail out cleanly when AUR_SSH_PRIVATE_KEY hasn't been set. The
      # one-time bootstrap (registering the AUR account's SSH key +
      # seeding each pkgname's AUR git repo) happens outside CI; until
      # that's done, the deploy action would fail with a confusing
      # "Permission denied (publickey)" and turn the release red.
      - name: Gate on AUR_SSH_PRIVATE_KEY
        id: gate-secret
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "AUR_SSH_PRIVATE_KEY secret is not set — skipping AUR publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate-secret.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Refresh PKGBUILD with release checksums
        if: steps.gate-secret.outputs.skip != 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          scripts/aur/update-pkgbuild.sh "${{ matrix.pkgname }}" "$VERSION"

      # The deploy action runs in an Arch container, regenerates
      # .SRCINFO with `makepkg --printsrcinfo`, commits, and pushes
      # over SSH. `allow_empty_commits: false` keeps re-runs against
      # an unchanged PKGBUILD from spamming the AUR git log.
      - name: Publish to AUR
        if: steps.gate-secret.outputs.skip != 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: ${{ matrix.pkgname }}
          pkgbuild: packaging/aur/${{ matrix.pkgname }}/PKGBUILD
          commit_username: "mold Release Bot"
          commit_email: "brink.james@gmail.com"
          commit_message: "Update to ${{ github.ref_name }}"
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          # AUR's git server presents RSA + ed25519 host keys; scan
          # both so we are resilient if either rotates.
          ssh_keyscan_types: "rsa,ed25519"
          allow_empty_commits: false
