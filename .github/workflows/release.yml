name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Rolling containers are deliberately separated from main-push delivery.
    # 12:47 UTC is 05:47 America/Phoenix and avoids the top-of-hour surge.
    - cron: "47 12 * * *"

concurrency:
  group: release-${{ github.event_name == 'schedule' && 'docker-nightly' || github.ref }}
  cancel-in-progress: true

env:
  # Rolling binaries route to the rolling GHCR map; stable tag builds embed the
  # exact release used to resolve its published target-to-digest manifest.
  MOLD_DISTRIBUTION_IMAGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
  MOLD_BUILD_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'nightly' }}

jobs:
  build-macos:
    if: github.event_name != 'schedule'
    runs-on: macos-14
    env:
      # sccache rejects incremental rustc invocations.
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.7

      - name: Probe sccache (disable on cache outage)
        shell: bash
        run: |
          # Mirror the CI probe in ci.yml: actually compile a tiny program through sccache
          # so we exercise the GHA cache backend, not just the local daemon. Outages there
          # surface only on first read — `sccache --start-server` alone won't catch them.
          set +e
          printf 'fn main() {}\n' > /tmp/sccache_probe.rs
          sccache rustc --edition 2021 -- /tmp/sccache_probe.rs -o /tmp/sccache_probe
          status=$?
          rm -f /tmp/sccache_probe /tmp/sccache_probe.rs
          if [ $status -ne 0 ]; then
            echo "::warning::sccache probe failed (likely GHA cache outage); falling back to direct rustc"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            sccache --stop-server >/dev/null 2>&1 || true
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2

      # Build the web SPA before cargo so mold-server's build.rs embeds the
      # real gallery UI instead of the placeholder stub (web/dist is
      # gitignored, so a bare checkout has nothing to embed).
      - name: Build embedded web SPA
        run: ./scripts/ensure-web-dist.sh

      - name: Install protoc
        # The `pulid` feature pulls in `candle-onnx`, whose build script shells
        # out to `protoc`.
        run: brew install protobuf

      - name: Build (Metal)
        run: cargo build --release -p mold-ai --features h3,mesh-texture,metal,preview,discord,expand,tui,webp,mp4,metrics,mdns,pulid

      - name: Ad-hoc code sign
        run: codesign -s - target/release/mold

      - name: Package
        run: tar -czf mold-aarch64-apple-darwin.tar.gz -C target/release mold

      - uses: actions/upload-artifact@v7
        with:
          name: mold-aarch64-apple-darwin
          path: mold-aarch64-apple-darwin.tar.gz

  # Self-signed Windows desktop + CPU CLI. The same pinned certificate signs
  # every executable; its public half ships beside the artifacts so managed
  # machines can opt into trust without making the private key public.
  build-windows:
    # Rolling Windows artifacts have their own non-cancellable workflow. Keep
    # this copy only for immutable tagged releases.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> desktop/src-tauri/target
          key: windows-release
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2

      - name: Install protoc and nasm
        shell: pwsh
        env:
          PROTOC_VERSION: "29.3"
        run: |
          $zip = "$env:RUNNER_TEMP\protoc.zip"
          $dest = "$env:RUNNER_TEMP\protoc"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "$dest\bin" >> $env:GITHUB_PATH
          "PROTOC=$dest\bin\protoc.exe" >> $env:GITHUB_ENV
          choco install --no-progress -y nasm
          "$env:ProgramFiles\NASM" >> $env:GITHUB_PATH
          & "$dest\bin\protoc.exe" --version
          if (-not (Test-Path "$env:ProgramFiles\NASM\nasm.exe")) {
            throw 'nasm was not installed'
          }

      - name: Build embedded web SPA
        shell: bash
        run: ./scripts/ensure-web-dist.sh

      - name: Import the self-signed Windows certificate
        id: windows-signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'mold-windows-self-signing.cert.cer'
          $thumbprint = & ./scripts/import-windows-signing-certificate.ps1 `
            -ConfigPath desktop/src-tauri/tauri.windows-self-signed.conf.json `
            -PublicCertificatePath $certificate
          "thumbprint=$thumbprint" >> $env:GITHUB_OUTPUT
          "WINDOWS_PUBLIC_CERTIFICATE=$certificate" >> $env:GITHUB_ENV

      - name: Build and sign the Windows CLI
        shell: pwsh
        run: |
          cargo build --release -p mold-ai `
            --features preview,discord,expand,tui,webp,metrics,mdns,pulid
          ./scripts/sign-windows-binary.ps1 `
            -ConfigPath desktop/src-tauri/tauri.windows-self-signed.conf.json `
            -FilePath target/release/mold.exe

      - name: Build the self-signed Windows desktop installer
        working-directory: desktop
        run: >-
          bunx tauri build --features pulid,webp --bundles nsis --ci -v
          --config src-tauri/tauri.windows-self-signed.conf.json

      - name: Re-sign the final standalone desktop executable
        shell: pwsh
        run: |
          ./scripts/sign-windows-binary.ps1 `
            -ConfigPath desktop/src-tauri/tauri.windows-self-signed.conf.json `
            -FilePath desktop/src-tauri/target/release/mold-desktop.exe

      - name: Verify and package Windows artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            desktop/src-tauri/target/release/bundle/nsis `
            -Filter *.exe `
            -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) { throw 'no NSIS installer was produced' }

          ./scripts/verify-windows-signatures.ps1 `
            -CertificatePath $env:WINDOWS_PUBLIC_CERTIFICATE `
            -ExpectedThumbprint '${{ steps.windows-signing.outputs.thumbprint }}' `
            -FilePath @(
              'target/release/mold.exe',
              'desktop/src-tauri/target/release/mold-desktop.exe',
              $installer.FullName
            )

          Copy-Item $installer.FullName 'Mold-windows-x64-self-signed.exe'
          Copy-Item $env:WINDOWS_PUBLIC_CERTIFICATE 'mold-windows-self-signing.cert.cer'
          Compress-Archive `
            -Path @('target/release/mold.exe', 'mold-windows-self-signing.cert.cer') `
            -DestinationPath 'mold-x86_64-pc-windows-msvc-cpu.zip'

      - uses: actions/upload-artifact@v7
        with:
          name: mold-windows-x64
          path: |
            Mold-windows-x64-self-signed.exe
            mold-windows-self-signing.cert.cer
            mold-x86_64-pc-windows-msvc-cpu.zip

  # Ampere (RTX 3090/A40, sm_86)
  build-linux-sm86:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Install build deps
        # `protobuf-compiler` is for the `pulid` feature: `candle-onnx`'s
        # build script drives `prost-build`, which shells out to `protoc`.
        run: sudo apt-get update && sudo apt-get install -y clang lld nasm protobuf-compiler

      - uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: local
          log-file-suffix: sm86
          linux-local-args: '["--toolkit"]'
          use-github-cache: false
          use-local-cache: false

      - name: Install cuDNN
        # Jimver installs the toolkit from the local .run installer, which does
        # not add NVIDIA's apt repository, so cuDNN has to come from the
        # keyring repo. The distro is derived at runtime rather than hardcoded
        # so a runner image bump does not silently 404. cudarc links libcudnn
        # dynamically and needs its headers at build time (#1483).
        run: |
          set -eux
          . /etc/os-release
          distro="${ID}$(echo "${VERSION_ID}" | tr -d '.')"
          curl -fsSLO "https://developer.download.nvidia.com/compute/cuda/repos/${distro}/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcudnn9-dev-cuda-12 libcudnn9-cuda-12

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.7

      - name: Probe sccache (disable on cache outage)
        shell: bash
        run: |
          set +e
          printf 'fn main() {}\n' > /tmp/sccache_probe.rs
          sccache rustc --edition 2021 -- /tmp/sccache_probe.rs -o /tmp/sccache_probe
          status=$?
          rm -f /tmp/sccache_probe /tmp/sccache_probe.rs
          if [ $status -ne 0 ]; then
            echo "::warning::sccache probe failed; falling back to direct rustc"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            sccache --stop-server >/dev/null 2>&1 || true
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-cuda-sm86-release
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2

      - name: Build embedded web SPA
        run: ./scripts/ensure-web-dist.sh

      - name: Build (CUDA sm_86)
        env:
          CUDA_COMPUTE_CAP: "86"
          LIBRARY_PATH: /usr/local/cuda/lib64/stubs
        run: cargo build --release -p mold-ai --features cuda,cudnn,preview,discord,expand,tui,webp,mp4,metrics,mdns,pulid

      - name: Seal generated CUDA PTX manifest
        run: scripts/seal-cuda-ptx-manifest.py target/release/mold 86 target/release/build

      - name: Package
        run: tar -czf mold-x86_64-unknown-linux-gnu-cuda-sm86.tar.gz -C target/release mold

      - name: Verify embedded target PTX, loader, NVML, and archive
        run: scripts/verify-cuda-release-binary.sh target/release/mold 86 mold-x86_64-unknown-linux-gnu-cuda-sm86.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: mold-x86_64-unknown-linux-gnu-cuda-sm86
          path: mold-x86_64-unknown-linux-gnu-cuda-sm86.tar.gz

