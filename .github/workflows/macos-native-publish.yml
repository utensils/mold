name: macOS native publish

# Publishes a signed native build and flips its Sparkle channel pointer.
#
# WHY NOT "push to main", the way `desktop.yml` triggers its nightly: this app
# lives on `feat/macos-native-app`, which is never merged. A `main` trigger
# would build a tree that does not contain the app, and the `v*` tags
# release-plz pushes are cut from `main` for the same reason. So the triggers
# are an explicit dispatch and this app's OWN tag namespace,
# `macos-native-v*`, which can be cut from whichever branch actually holds it.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel to publish
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
  push:
    tags:
      - "macos-native-v*"

concurrency:
  group: macos-native-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    uses: ./.github/workflows/macos-native-distribution.yml
    with:
      channel: ${{ github.event_name == 'push' && 'stable' || inputs.channel }}
    secrets: inherit

  publish:
    name: Publish update
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.workflow_artifact_name }}
          path: artifacts

      # The order below is `desktop.yml:636-723`'s, step for step, because
      # every step of it is there for a failure that happened: immutable
      # version-unique assets FIRST, prove them anonymously, re-check that
      # this build is still the one being asked for, only THEN clobber the
      # channel pointer, prove that anonymously too, and prune last.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.build.outputs.release_tag == 'latest' && 'nightly' || 'stable' }}
          VERSION: ${{ needs.build.outputs.version }}
          DMG_NAME: ${{ needs.build.outputs.dmg_name }}
          APPCAST_NAME: ${{ needs.build.outputs.appcast_name }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          dmg="artifacts/$DMG_NAME"
          appcast="artifacts/updates/$APPCAST_NAME"
          for path in "$dmg" "$appcast"; do
            if [[ ! -f "$path" ]]; then
              echo "::error::missing artifact $path"
              exit 1
            fi
          done

          # The status has to be read INSIDE the else branch: after a whole
          # `if` with no else, `$?` is the `if`'s own 0 and every stale build
          # would sail through. `desktop.yml:618-627` spells it the same way.
          head_guard() {
            if apps/macos/scripts/check-publish-head.sh "$GITHUB_SHA"; then
              :
            else
              local status=$?
              if [[ "$status" -eq 10 ]]; then
                echo "::notice::Skipping stale native $VERSION; $1"
                exit 0
              fi
              exit "$status"
            fi
          }
          head_guard "the branch advanced during the build."

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            prerelease=()
            if [[ "$RELEASE_TAG" == "latest" ]]; then prerelease=(--prerelease); fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$( [[ "$RELEASE_TAG" == "latest" ]] && echo "Latest Build" || echo "Mold for macOS $VERSION" )" \
              --notes "Mold for macOS $VERSION." \
              "${prerelease[@]}" \
              || gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi

          # 1. The immutable, version-unique payload.
          gh release upload "$RELEASE_TAG" "$dmg" --repo "$GITHUB_REPOSITORY" --clobber

          # 2. Prove it is really there, anonymously, and byte-identical.
          dmg_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$DMG_NAME"
          expected_sha=$(sha256sum "$dmg" | awk '{print $1}')
          ready=false
          for attempt in $(seq 1 20); do
            if curl -fsSL "$dmg_url" -o "$RUNNER_TEMP/$DMG_NAME"; then
              if [[ "$(sha256sum "$RUNNER_TEMP/$DMG_NAME" | awk '{print $1}')" == "$expected_sha" ]]; then
                ready=true
                break
              fi
            fi
            if [[ "$attempt" -lt 20 ]]; then
              echo "DMG not anonymously available yet (attempt $attempt/20); retrying in 15s"
              sleep 15
            fi
          done
          if [[ "$ready" != true ]]; then
            echo "::error::the DMG failed anonymous SHA-256 verification"
            exit 1
          fi

          # 3. Ask again at the pointer boundary: a newer run may have started
          #    while that payload propagated.
          head_guard "the branch advanced before the appcast flip."

          # 4. THEN the pointer.
          gh release upload "$RELEASE_TAG" "$appcast" --repo "$GITHUB_REPOSITORY" --clobber

          # 5. Prove the pointer too, anonymously, and that it names the exact
          #    payload just verified.
          if [[ "$CHANNEL" == "stable" ]]; then
            appcast_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$APPCAST_NAME"
          else
            appcast_url="https://github.com/$GITHUB_REPOSITORY/releases/download/latest/$APPCAST_NAME"
          fi
          ready=false
          for attempt in $(seq 1 20); do
            if curl -fsSL "$appcast_url" -o "$RUNNER_TEMP/$APPCAST_NAME" \
              && grep -q "$DMG_NAME" "$RUNNER_TEMP/$APPCAST_NAME" \
              && grep -q 'sparkle:edSignature' "$RUNNER_TEMP/$APPCAST_NAME"; then
              ready=true
              break
            fi
            if [[ "$attempt" -lt 20 ]]; then
              echo "Appcast not anonymously available yet (attempt $attempt/20); retrying in 15s"
              sleep 15
            fi
          done
          if [[ "$ready" != true ]]; then
            echo "::error::the appcast failed anonymous verification"
            exit 1
          fi

          # 6. Only now is it safe to remove older generations. Nightly only:
          #    a stable release owns its own tag and nothing accumulates.
          if [[ "$RELEASE_TAG" == "latest" ]]; then
            gh release view latest --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' \
              | grep -E '^Mold-.*\.dmg$' \
              | grep -vx "$DMG_NAME" \
              | sort -V \
              | head -n -9 \
              | while IFS= read -r stale; do
                  echo "pruning $stale"
                  gh release delete-asset latest "$stale" --repo "$GITHUB_REPOSITORY" --yes || true
                done
          fi

          echo "Published Mold for macOS $VERSION ($CHANNEL)"
          echo "Appcast: $appcast_url"
