name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "1"

# Cache strategy: jobs that compile the same features share a cache key.
# Only main-branch pushes save caches; PRs read from main's cache.
#
# Path-aware gating: the `changes` job classifies the diff, and each gate only
# runs when its surface actually changed — a docs-only PR no longer compiles
# the Rust workspace twice. This MUST stay as job-level `if:` conditions, NOT
# `on.<event>.paths` filters: rust/coverage/docs/web are required status
# checks, and a workflow that never triggers leaves them "Expected — waiting"
# forever (blocking every docs-only PR and the release-plz PR). A job skipped
# by `if:` reports "skipped", which branch protection counts as passing.

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      website: ${{ steps.filter.outputs.website }}
      web: ${{ steps.filter.outputs.web }}
      nix: ${{ steps.filter.outputs.nix }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            website:
              - 'website/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'studio/**'
              - 'ui/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.nix'
              - '.github/workflows/ci.yml'
            nix:
              - 'web/**'
              - 'desktop/**'
              - 'studio/**'
              - 'ui/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.nix'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - '.github/workflows/ci.yml'
            release:
              - 'Dockerfile'
              - 'flake.nix'
              - 'install.sh'
              - 'nix/**'
              - 'packaging/**'
              - 'crates/mold-cli/Cargo.toml'
              - 'desktop/src-tauri/Cargo.toml'
              - 'release-plz.toml'
              - 'website/deployment/docker.md'
              - 'website/guide/installation.md'
              - '.github/workflows/release.yml'
              - 'scripts/release/**'
              - 'scripts/verify-cuda-release-binary.sh'
              - 'scripts/probe-cuda-embedded-ptx.py'
              - 'scripts/create-release-provenance.sh'
              - 'scripts/create-container-digest-manifest.sh'
              - 'scripts/validate-cuda-qualification-report.py'
              - 'scripts/verify-png-artifact.py'
              - 'scripts/tests/ci-coverage-disk-guard.sh'
              - 'scripts/tests/cuda-distribution-contract.sh'
              - 'scripts/tests/install-cuda-arch.sh'
              - 'scripts/tests/cuda-qualification-contract.sh'
              - 'scripts/qualify-cuda-sm86.sh'
              - 'docs/qualification/**'
              - 'scripts/tests/docker-web-context.sh'
              - 'scripts/tests/release-sync-pr.sh'
              - '.github/workflows/release-plz.yml'
              - '.github/workflows/ci.yml'

  release:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test release PR synchronization
        run: bash scripts/tests/release-sync-pr.sh
      - name: Test CI coverage disk guard
        run: bash scripts/tests/ci-coverage-disk-guard.sh
      - name: Test Docker web build context
        run: bash scripts/tests/docker-web-context.sh
      - name: Test CUDA distribution contract
        run: bash scripts/tests/cuda-distribution-contract.sh
      - name: Test installer CUDA architecture selection
        run: bash scripts/tests/install-cuda-arch.sh
      - name: Test deferred CUDA qualification contract
        run: bash scripts/tests/cuda-qualification-contract.sh

  docs:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install docs dependencies
        working-directory: website
        run: bun install
      - name: Check docs formatting
        working-directory: website
        run: bun run fmt:check
      - name: Verify docs references
        working-directory: website
        run: bun run verify
      - name: Build docs
        working-directory: website
        run: bun run build

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install web dependencies
        run: bun install --frozen-lockfile
      - name: Check frontend architecture and dead code
        run: bun run check:architecture && bun run check:dead-code
      - name: Run shared Studio tests
        run: bun run test:studio
      - name: Check web formatting
        working-directory: web
        run: bun run fmt:check
      - name: Run web tests
        working-directory: web
        run: bun run test
      - name: Build web SPA (includes vue-tsc typecheck)
        working-directory: web
        run: bun run build

  nix-web:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build mold-web with Nix sandbox
        run: nix build .#mold-web --print-build-logs

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Install Rust build deps
        run: sudo apt-get update && sudo apt-get install -y clang lld nasm libwebp-dev
      - uses: mozilla-actions/sccache-action@v0.0.7
      - name: Probe sccache (disable on cache outage)
        shell: bash
        run: |
          set +e
          printf 'fn main() {}\n' > /tmp/sccache_probe.rs
          sccache rustc --edition 2021 -- /tmp/sccache_probe.rs -o /tmp/sccache_probe
          status=$?
          rm -f /tmp/sccache_probe /tmp/sccache_probe.rs
          if [ $status -ne 0 ]; then
            echo "sccache probe failed — disabling RUSTC_WRAPPER for this job"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            sccache --stop-server >/dev/null 2>&1 || true
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-default
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Check with all optional features
        run: cargo check -p mold-ai --features preview,discord,expand,tui,webp,mp4,mdns

  cuda-check:
    name: CUDA forced-local typecheck
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    env:
      CUDA_COMPUTE_CAP: "89"
      LIBRARY_PATH: /usr/local/cuda/lib64/stubs
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
      - name: Install Rust build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld nasm libwebp-dev
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: local
          log-file-suffix: root-ci-sm89
          linux-local-args: '["--toolkit"]'
          use-github-cache: false
          use-local-cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-cuda-sm89
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check CUDA forced-local and server paths
        run: cargo check -p mold-ai --features cuda,preview,expand,tui,webp,mp4,mdns

  metal-check:
    name: Metal forced-local typecheck
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-metal
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Metal forced-local and server paths
        run: cargo check -p mold-ai --features metal,preview,expand,tui,webp,mp4,mdns

  coverage:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust build deps
        run: sudo apt-get update && sudo apt-get install -y clang lld nasm libwebp-dev

      - uses: mozilla-actions/sccache-action@v0.0.7

      - name: Probe sccache (disable on cache outage)
        shell: bash
        run: |
          set +e
          printf 'fn main() {}\n' > /tmp/sccache_probe.rs
          sccache rustc --edition 2021 -- /tmp/sccache_probe.rs -o /tmp/sccache_probe
          status=$?
          rm -f /tmp/sccache_probe /tmp/sccache_probe.rs
          if [ $status -ne 0 ]; then
            echo "sccache probe failed — disabling RUSTC_WRAPPER for this job"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            sccache --stop-server >/dev/null 2>&1 || true
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-llvm-cov
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
