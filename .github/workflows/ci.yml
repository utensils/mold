name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # sccache rejects incremental rustc invocations. Keeping this disabled makes
  # the shared compiler cache effective instead of tripping the fallback probe
  # and recompiling every PR from scratch.
  CARGO_INCREMENTAL: "0"

concurrency:
  # A pushed commit makes every older run for that PR obsolete. Cancel it
  # before it can keep scarce macOS/CUDA runners busy. Main runs are never
  # canceled because they warm caches and provide the post-merge signal.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Cache strategy: jobs that compile the same features share a cache key.
# Only main-branch pushes save caches; PRs read from main's cache.
#
# Path-aware gating: the `changes` job classifies the diff, and each gate only
# runs when its surface actually changed — a docs-only PR no longer compiles
# the Rust workspace twice. This MUST stay as job-level `if:` conditions, NOT
# `on.<event>.paths` filters: rust/coverage/docs/web are required status
# checks, and a workflow that never triggers leaves them "Expected — waiting"
# forever (blocking every docs-only PR and the release-plz PR). A job skipped
# by `if:` reports "skipped", which branch protection counts as passing.

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      gpu: ${{ steps.filter.outputs.gpu }}
      website: ${{ steps.filter.outputs.website }}
      web: ${{ steps.filter.outputs.web }}
      nix: ${{ steps.filter.outputs.nix }}
      release: ${{ steps.filter.outputs.release }}
      workflow: ${{ steps.filter.outputs.workflow }}
      trusted_release_pr: ${{ steps.policy.outputs.trusted_release_pr }}
    steps:
      - name: Detect the trusted release-plz PR
        id: policy
        env:
          TRUSTED_RELEASE_PR: ${{ github.event_name == 'pull_request' && github.actor == 'release-plz-mold[bot]' && startsWith(github.head_ref, 'release-plz-') && github.event.pull_request.head.repo.full_name == github.repository }}
        run: echo "trusted_release_pr=$TRUSTED_RELEASE_PR" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/qualify-local-multi-gpu.py'
              - 'scripts/validate-local-multi-gpu-report.py'
              - 'scripts/tests/local-multi-gpu-qualification-contract.sh'
              - 'scripts/tests/local_multi_gpu_qualification_test.py'
              - 'docs/qualification/local-multi-gpu-report.schema.json'
              - 'scripts/minimax-h3-conformance.py'
              - 'scripts/tests/minimax-h3-conformance-contract.py'
              - 'scripts/tests/minimax-h3-private-uat-release-contract.sh'
              - 'tests/fixtures/minimax_h3/**'
              - 'docs/qualification/minimax-h3-*.json'
              - 'docs/qualification/minimax-h3-conformance.md'
              - 'docs/qualification/README.md'
            # Forced-local checks exist to compile backend-specific code that
            # the ordinary workspace gate cannot see. Backend-neutral crates
            # (catalog, DB, Discord, scheduler) are already covered by `rust`.
            gpu:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/mold-cli/**'
              - 'crates/mold-candle/**'
              - 'crates/mold-core/**'
              - 'crates/mold-inference/**'
              - 'crates/mold-server/**'
              - 'crates/mold-tui/**'
            website:
              - 'website/**'
            web:
              - 'web/**'
              - 'studio/**'
              - 'ui/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.nix'
            nix:
              - 'web/**'
              - 'studio/**'
              - 'ui/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.nix'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
            release:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - 'flake.nix'
              - 'install.sh'
              - 'nix/**'
              - 'packaging/**'
              - 'crates/mold-cli/Cargo.toml'
              - 'crates/mold-candle/Cargo.toml'
              - 'crates/mold-candle/src/minimax_h3/attention.rs'
              - 'crates/mold-candle/src/minimax_h3/mod.rs'
              - 'crates/mold-candle/src/minimax_h3/dit.rs'
              - 'crates/mold-candle/src/minimax_h3/visual_vae.rs'
              - 'crates/mold-inference/Cargo.toml'
              - 'crates/mold-inference/src/lib.rs'
              - 'crates/mold-inference/src/bin/h3_attention_qualification.rs'
              - 'crates/mold-inference/src/bin/h3_attention_benchmark.rs'
              - 'crates/mold-inference/src/bin/h3_artifact_qualification.rs'
              - 'crates/mold-inference/src/minimax_h3/mod.rs'
              - 'crates/mold-inference/src/minimax_h3/private_*.rs'
              - 'crates/mold-server/src/lib.rs'
              - 'crates/mold-cli/src/main.rs'
              - 'desktop/src-tauri/src/main.rs'
              - 'crates/mold-cli/src/commands/lambda.rs'
              - 'crates/mold-cli/src/commands/runpod.rs'
              - 'crates/mold-core/src/cuda_distribution.rs'
              - 'crates/mold-server/Cargo.toml'
              - 'desktop/src-tauri/Cargo.toml'
              - 'desktop/src-tauri/Cargo.lock'
              - 'desktop/src-tauri/src/runpod.rs'
              - 'release-plz.toml'
              - 'website/deployment/docker.md'
              - 'website/deployment/nixos.md'
              - 'website/guide/installation.md'
              - 'scripts/release/**'
              - 'scripts/verify-cuda-release-binary.sh'
              - 'scripts/verify-h3-release-exclusion.sh'
              - 'scripts/probe-cuda-embedded-ptx.py'
              - 'scripts/seal-cuda-ptx-manifest.py'
              - 'scripts/create-release-provenance.sh'
              - 'scripts/create-container-digest-manifest.sh'
              - 'scripts/validate-cuda-qualification-report.py'
              - 'scripts/verify-png-artifact.py'
              - 'scripts/tests/ci-coverage-disk-guard.sh'
              - 'scripts/tests/ci-routing-contract.sh'
              - 'scripts/tests/cuda-distribution-contract.sh'
              - 'scripts/tests/cuda-ptx-parser-contract.py'
              - 'scripts/tests/install-cuda-arch.sh'
              - 'scripts/tests/cuda-qualification-contract.sh'
              - 'scripts/tests/minimax-h3-attention-release-contract.sh'
              - 'scripts/tests/minimax-h3-private-uat-release-contract.sh'
              - 'scripts/qualify-cuda-sm86.sh'
              - 'docs/qualification/**'
              - 'scripts/tests/docker-web-context.sh'
              - 'scripts/tests/desktop-candle-lock-sync.sh'
              - 'scripts/tests/desktop-candle-nix-source-hash.sh'
              - 'scripts/tests/release-sync-pr.sh'
              - 'scripts/tests/crates-publish-contract.sh'
              - '.github/workflows/**'
            # Workflow-only PRs get static actionlint/routing-contract proof.
            # After merge, exercise every dynamic path against the real runner
            # environment without putting those expensive jobs on the PR.
            workflow:
              - '.github/workflows/ci.yml'

  docs:
    needs: changes
    if: >-
      always() && !cancelled() &&
      (needs.changes.result != 'success' ||
       ((needs.changes.outputs.website == 'true' ||
         (github.event_name == 'push' && needs.changes.outputs.workflow == 'true')) &&
        needs.changes.outputs.trusted_release_pr != 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: |
          echo "::error::The required path classifier did not complete successfully."
          exit 1
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install docs dependencies
        working-directory: website
        run: bun install
      - name: Check docs formatting
        working-directory: website
        run: bun run fmt:check
      - name: Verify docs references
        working-directory: website
        run: bun run verify
      - name: Build docs
        working-directory: website
        run: bun run build

  web:
    needs: changes
    if: >-
      always() && !cancelled() &&
      (needs.changes.result != 'success' ||
       ((needs.changes.outputs.web == 'true' ||
         (github.event_name == 'push' && needs.changes.outputs.workflow == 'true')) &&
        needs.changes.outputs.trusted_release_pr != 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: |
          echo "::error::The required path classifier did not complete successfully."
          exit 1
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install web dependencies
        run: bun install --frozen-lockfile
      - name: Check frontend architecture and dead code
        run: bun run check:architecture && bun run check:dead-code
      - name: Run shared Studio tests
        run: bun run test:studio
      - name: Check web formatting
        working-directory: web
        run: bun run fmt:check
      - name: Run web tests
        working-directory: web
        run: bun run test
      - name: Build web SPA (includes vue-tsc typecheck)
        working-directory: web
        run: bun run build

  nix-web:
    needs: changes
    if: >-
      needs.changes.outputs.nix == 'true' ||
      (github.event_name == 'push' && needs.changes.outputs.workflow == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build mold-web with Nix sandbox
        run: nix build .#mold-web --print-build-logs

  rust:
    needs: changes
    if: >-
      always() && !cancelled() &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.trusted_release_pr == 'true' ||
       needs.changes.outputs.release == 'true' ||
       needs.changes.outputs.rust == 'true' ||
       (github.event_name == 'push' && needs.changes.outputs.workflow == 'true'))
    runs-on: ubuntu-latest
    env:
      RUN_RUST_SUITE: ${{ needs.changes.outputs.trusted_release_pr != 'true' && (needs.changes.outputs.rust == 'true' || (github.event_name == 'push' && needs.changes.outputs.workflow == 'true')) }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: |
          echo "::error::The required path classifier did not complete successfully."
          exit 1
      - name: Require trusted release routing
        if: needs.changes.outputs.trusted_release_pr == 'true' && needs.changes.outputs.release != 'true'
        run: |
          echo "::error::The trusted release PR did not reach the release contract route."
          exit 1
      - uses: actions/checkout@v6
        if: needs.changes.outputs.trusted_release_pr != 'true'
      - uses: actions/checkout@v6
        if: needs.changes.outputs.trusted_release_pr == 'true'
        with:
          fetch-depth: 0
      - name: Validate trusted release-plz file scope
        if: needs.changes.outputs.trusted_release_pr == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed_count=0
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            [[ "$status" == M ]] || {
              echo "::error::Generated release PR may only modify tracked files, got $status for $path"
              exit 1
            }
            ((changed_count += 1))
            case "$path" in
              CHANGELOG.md|Cargo.toml|Cargo.lock|desktop/package.json|desktop/src-tauri/Cargo.toml|desktop/src-tauri/Cargo.lock|apps/mobile/src-tauri/Cargo.toml|apps/mobile/src-tauri/Cargo.lock|apps/mobile/src-tauri/tauri.conf.json)
                ;;
              crates/*/Cargo.toml)
                [[ "$path" =~ ^crates/[^/]+/Cargo\.toml$ ]] || {
                  echo "::error::Unexpected generated release path: $path"
                  exit 1
                }
                ;;
              *)
                echo "::error::Unexpected generated release path: $path"
                exit 1
                ;;
            esac
          done < <(git diff --name-status -z "$BASE_SHA...$HEAD_SHA")
          ((changed_count > 0)) || {
            echo "::error::Trusted release PR has no changed files."
            exit 1
          }
      - name: Validate all locked Cargo graphs
        if: needs.changes.outputs.release == 'true'
        env:
          RUSTC_WRAPPER: ""
        run: |
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo metadata --locked --no-deps --format-version 1 \
            --manifest-path desktop/src-tauri/Cargo.toml >/dev/null
          cargo metadata --locked --no-deps --format-version 1 \
            --manifest-path apps/mobile/src-tauri/Cargo.toml >/dev/null
      - uses: DeterminateSystems/determinate-nix-action@v3
        if: needs.changes.outputs.release == 'true'
      - name: Run protected release contracts
        if: needs.changes.outputs.release == 'true'
        run: |
          nix run nixpkgs#actionlint -- .github/workflows/*.yml
          bash scripts/tests/release-sync-pr.sh
          bash scripts/tests/crates-publish-contract.sh
          bash scripts/tests/ci-coverage-disk-guard.sh
          bash scripts/tests/ci-routing-contract.sh
          bash scripts/tests/docker-web-context.sh
          bash scripts/tests/desktop-candle-lock-sync.sh
          bash scripts/tests/desktop-candle-nix-source-hash.sh
          bash scripts/tests/cuda-distribution-contract.sh
          python3 scripts/tests/cuda-ptx-parser-contract.py
          bash scripts/tests/install-cuda-arch.sh
          bash scripts/tests/cuda-qualification-contract.sh
          bash scripts/tests/minimax-h3-attention-release-contract.sh
      - name: Test MiniMax H3 private-UAT release contract
        if: needs.changes.outputs.release == 'true'
        run: bash scripts/tests/minimax-h3-private-uat-release-contract.sh
      - uses: dtolnay/rust-toolchain@stable
        if: env.RUN_RUST_SUITE == 'true'
        with:
          components: rustfmt,clippy
      - name: Install Rust build deps
        if: env.RUN_RUST_SUITE == 'true'
        run: sudo apt-get update && sudo apt-get install -y clang lld nasm libwebp-dev
      - uses: mozilla-actions/sccache-action@v0.0.7
        if: env.RUN_RUST_SUITE == 'true'
      - name: Enable sccache
        if: env.RUN_RUST_SUITE == 'true'
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Probe sccache (disable on cache outage)
        if: env.RUN_RUST_SUITE == 'true'
        shell: bash
        run: |
          set +e
          printf 'fn main() {}\n' > /tmp/sccache_probe.rs
          sccache rustc --edition 2021 -- /tmp/sccache_probe.rs -o /tmp/sccache_probe
          status=$?
          rm -f /tmp/sccache_probe /tmp/sccache_probe.rs
          if [ $status -ne 0 ]; then
            echo "sccache probe failed — disabling RUSTC_WRAPPER for this job"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            sccache --stop-server >/dev/null 2>&1 || true
          fi
      - uses: Swatinem/rust-cache@v2
        if: env.RUN_RUST_SUITE == 'true'
        with:
          shared-key: workspace-default
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check declared MSRV
        if: env.RUN_RUST_SUITE == 'true'
        shell: bash
        run: |
          msrv=$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          case "$msrv" in
            *.*.*) msrv_toolchain=$msrv ;;
            *.*) msrv_toolchain=$msrv.0 ;;
            *) echo "Invalid rust-version: $msrv" >&2; exit 1 ;;
          esac
          rustup toolchain install "$msrv_toolchain" --profile minimal
          cargo "+$msrv_toolchain" check --workspace --all-targets --locked
          cargo "+$msrv_toolchain" check -p mold-ai --locked \
            --features preview,discord,expand,tui,metrics,webp,mp4,mdns
      - name: Format
        if: env.RUN_RUST_SUITE == 'true'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: env.RUN_RUST_SUITE == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The live Hugging Face search is an external-service monitor, not a
      # deterministic change gate. It has repeatedly failed release PRs on 429
      # responses, so keep that signal on main without forcing PR reruns.
      - name: Test (PR suite)
        if: env.RUN_RUST_SUITE == 'true' && github.event_name == 'pull_request'
        run: >-
          cargo test --workspace --
          --skip catalog_api::catalog_live_test::live_search_free_text_can_find_manual_clip_components
      - name: Test (full main suite)
        if: env.RUN_RUST_SUITE == 'true' && github.event_name == 'push'
        run: cargo test --workspace
      - name: Test local multi-GPU qualification contract
        if: env.RUN_RUST_SUITE == 'true'
        run: bash scripts/tests/local-multi-gpu-qualification-contract.sh
      - name: Test MiniMax H3 conformance contract
        if: env.RUN_RUST_SUITE == 'true'
        run: python3 scripts/tests/minimax-h3-conformance-contract.py
      - name: Clippy the private MiniMax H3 artifact qualifier
        if: env.RUN_RUST_SUITE == 'true'
        run: cargo clippy -p mold-ai-inference --features dev-bins,h3-private-uat --bin h3_artifact_qualification -- -D warnings
      - name: Test private MiniMax H3 foundations
        if: env.RUN_RUST_SUITE == 'true'
        run: cargo test -p mold-ai-inference --lib --features h3-private-uat minimax_h3
      - name: Check with all optional features
        if: env.RUN_RUST_SUITE == 'true'
        run: cargo check -p mold-ai --features preview,discord,expand,tui,webp,mp4,mdns
      - name: Record protected gate success
        run: echo "Required Rust and release routes completed successfully."

  cuda-check:
    name: CUDA forced-local typecheck
    needs: changes
    if: >-
      needs.changes.outputs.trusted_release_pr != 'true' &&
      (needs.changes.outputs.gpu == 'true' ||
       (github.event_name == 'push' && needs.changes.outputs.workflow == 'true'))
    runs-on: ubuntu-22.04
    env:
      CUDA_COMPUTE_CAP: "89"
      LIBRARY_PATH: /usr/local/cuda/lib64/stubs
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
      - name: Install Rust build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld nasm libwebp-dev
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: local
          log-file-suffix: root-ci-sm89
          linux-local-args: '["--toolkit"]'
          use-github-cache: false
          use-local-cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-cuda-sm89
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy CUDA forced-local and server paths
        run: cargo clippy -p mold-ai --features cuda,preview,expand,tui,webp,mp4,mdns --all-targets -- -D warnings

  # The `flash-attn` feature was decorative for months (issue #598) precisely
  # because nothing ever compiled it: the cfg-stripped fallback in
  # `attention.rs` rotted into dead code that only a `--features flash-attn`
  # build can see. This job is the gate that keeps that from recurring.
  #
  # It runs after every main update so dependency and workflow drift remain
  # covered. Cold builds can take more than an hour, and the feature is not
  # included in any release artifact, so it never consumes the PR critical
  # path or read-only PR cache generations.
  flash-attn-check:
    name: FlashAttention feature typecheck
    needs: changes
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      CUDA_COMPUTE_CAP: "89"
      LIBRARY_PATH: /usr/local/cuda/lib64/stubs
      # cudaforge defaults to half the available cores; on a 4-vCPU hosted
      # runner that halves an already long kernel build. 3 keeps peak nvcc
      # memory clear of the 16 GiB ceiling.
      CUDAFORGE_THREADS: "3"
      # Pin the kernel OUT_DIR so the cache survives a cargo metadata-hash
      # change. cudaforge decides freshness by content hash, not mtime, so a
      # restored directory short-circuits the whole 53-kernel build.
      CANDLE_FLASH_ATTN_BUILD_DIR: ${{ github.workspace }}/.flash-attn-kernels
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
      - name: Install Rust build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld nasm libwebp-dev
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: local
          log-file-suffix: root-ci-flash-sm89
          linux-local-args: '["--toolkit"]'
          use-github-cache: false
          use-local-cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          # MUST NOT share `workspace-cuda-sm89`: the key carries no feature
          # component, so the two jobs would collide and only one save would win.
          shared-key: workspace-cuda-flash-sm89
          # rust-cache covers CARGO_HOME and target/ only. The kernel objects
          # and cudaforge's CUTLASS checkout live outside both, and re-cloning
          # CUTLASS from github.com on every run is an unretried network
          # dependency inside a build script.
          cache-directories: |
            ~/.cudaforge
            ${{ github.workspace }}/.flash-attn-kernels
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # candle-flash-attn canonicalizes CANDLE_FLASH_ATTN_BUILD_DIR and panics
      # if it is missing rather than creating it, so it has to exist before the
      # first cargo invocation. This runs after the cache restore: on a warm
      # run the directory is already populated and mkdir -p is a no-op.
      - name: Create the kernel build directory
        run: mkdir -p "$CANDLE_FLASH_ATTN_BUILD_DIR"
      # `--all-targets` on `-p mold-ai` would NOT compile mold-inference's test
      # module (it builds that crate as a plain dependency lib), so the gate has
      # to name the inference crate directly to cover its `#[cfg(test)]` code.
      # `dev-bins` pulls in `attention_bench`, which no other gate compiles.
      - name: Clippy the flash-attn inference lib, tests and dev-bins
        run: cargo clippy -p mold-ai-inference --features flash-attn,dev-bins --all-targets -- -D warnings
      - name: Clippy the flash-attn binary wiring
        run: cargo clippy -p mold-ai --features flash-attn -- -D warnings
      - name: Clippy the isolated MiniMax H3 release-candidate kernel
        run: cargo clippy -p mold-ai-candle --features h3-flash-attn-rc --all-targets -- -D warnings
      - name: Clippy the synthetic MiniMax H3 qualification probe
        run: cargo clippy -p mold-ai-inference --features h3-attention-rc,dev-bins --bin h3_attention_qualification -- -D warnings
      - name: Clippy the synthetic MiniMax H3 packed-row benchmark
        run: cargo clippy -p mold-ai-inference --features h3-attention-rc,dev-bins --bin h3_attention_benchmark -- -D warnings

  metal-check:
    name: Metal forced-local typecheck
    needs: changes
    if: >-
      needs.changes.outputs.trusted_release_pr != 'true' &&
      (needs.changes.outputs.gpu == 'true' ||
       (github.event_name == 'push' && needs.changes.outputs.workflow == 'true'))
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-metal
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy Metal forced-local and server paths
        run: cargo clippy -p mold-ai --features metal,preview,expand,tui,webp,mp4,mdns --all-targets -- -D warnings

  coverage:
    needs: changes
    # PRs already run the deterministic behavioral suite in `rust`; only the
    # external-service catalog monitor is main-only. Coverage is informational,
    # so collect it after merge instead of recompiling on every revision.
    if: >-
      always() && !cancelled() &&
      (needs.changes.result != 'success' ||
       (github.event_name == 'push' &&
        (needs.changes.outputs.rust == 'true' ||
         needs.changes.outputs.workflow == 'true')))
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: |
          echo "::error::The required path classifier did not complete successfully."
          exit 1
      - uses: actions/checkout@v6

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust build deps
        run: sudo apt-get update && sudo apt-get install -y clang lld nasm libwebp-dev

      - uses: mozilla-actions/sccache-action@v0.0.7

      - name: Probe sccache (disable on cache outage)
        shell: bash
        run: |
          set +e
          printf 'fn main() {}\n' > /tmp/sccache_probe.rs
          sccache rustc --edition 2021 -- /tmp/sccache_probe.rs -o /tmp/sccache_probe
          status=$?
          rm -f /tmp/sccache_probe /tmp/sccache_probe.rs
          if [ $status -ne 0 ]; then
            echo "sccache probe failed — disabling RUSTC_WRAPPER for this job"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            sccache --stop-server >/dev/null 2>&1 || true
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-llvm-cov
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
