  #       run: |
  #         mkdir -p "$RUNNER_TEMP/cuda-driver-stub"
  #         ln -s /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/cuda-driver-stub/libcuda.so.1"
  #         LD_LIBRARY_PATH="$RUNNER_TEMP/cuda-driver-stub:${LD_LIBRARY_PATH:-}" bash scripts/test-h3-cuda-server.sh

  # `#[cfg(any(feature = "cuda", feature = "metal"))]` guards the mold-cli call
  # sites into `mold_server::execution_plan` (`materialize_request`,
  # `validate_before_cuda`). `metal-check` below compiles ONE of those two arms;
  # this job is the other. Without it the pull-request route's whole answer for
  # that seam is a default-feature build that type-checks NEITHER arm, so a
  # mold-server signature change lands green while every shipping CUDA artifact
  # fails with E0061 -- which is exactly what happened, unnoticed, for several
  # commits.
  #
  # Deliberately a `cargo check`: nothing here links, runs a kernel, or needs a
  # GPU. nvcc is required all the same, because candle-kernels' build script
  # emits PTX before any Rust in the CUDA graph can be checked. The retired
  # 40-minute forced-local CUDA job is not coming back; shipped artifacts still
  # compile in the release workflows.
  cuda-typecheck:
    name: CUDA forced-local typecheck
    timeout-minutes: 45
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.trusted_release_pr != 'true' &&
      needs.changes.outputs.cuda_typecheck == 'true'
    runs-on: ubuntu-latest
    env:
      # candle-kernels emits PTX for one capability. sm_89 is the default
      # shipped target; the cfg arm being type-checked is capability-neutral.
      CUDA_COMPUTE_CAP: "89"
      # A hosted runner has no driver. `cargo check` links nothing, so this is
      # only insurance for a build script that probes for libcuda: it finds the
      # toolkit's stub rather than nothing at all.
      LIBRARY_PATH: /usr/local/cuda/lib64/stubs
      # rust-cache hashes every CARGO_*/RUST* value into the key it restores,
      # so this MUST match `rust` exactly or the restore below misses.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
      - name: Free runner disk space
        # The local CUDA installer needs several GB the hosted image spends on
        # toolchains this job never uses.
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY"
          df -h
      - name: Install Rust build deps
        run: sudo apt-get update && sudo apt-get install -y clang lld nasm libwebp-dev protobuf-compiler
      - uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: local
          log-file-suffix: pr-cuda-typecheck
          linux-local-args: '["--toolkit"]'
          use-github-cache: false
          use-local-cache: false
      - uses: dtolnay/rust-toolchain@stable
      # RESTORE ONLY. The Actions cache store is at its 10 GB ceiling, so this
      # job must not own a key: it reads the union cache `rust` writes on main
      # for the crates a CUDA build shares with it, and recompiles the rest.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-default
          save-if: false
      - name: Typecheck the CUDA forced-local and server paths
        run: cargo check -p mold-ai --features cuda,preview,expand,tui,webp,mp4,metrics,mdns

  metal-check:
    name: Metal forced-local typecheck
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.trusted_release_pr != 'true' &&
      (needs.changes.outputs.gpu == 'true' || needs.changes.outputs.workflow == 'true')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-metal
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install protoc
        # The `pulid` feature pulls in `candle-onnx`, whose build script shells
        # out to `protoc`.
        run: brew install protobuf
      - name: Clippy Metal forced-local and server paths
        run: cargo clippy -p mold-ai --features h3,mesh-texture,mesh-matting,mesh-delight,metal,preview,expand,tui,webp,mp4,mdns,pulid --all-targets -- -D warnings
      - name: Check reviewed H3 Metal server recipe
        run: cargo check -p mold-ai-server --features h3,mesh-texture,mesh-matting,mesh-delight,metal,expand,mdns,metrics,mp4,pulid,webp

  # Codecov remains a main-branch reporting signal. It is intentionally not a
  # required PR check: the protected Rust job already runs the same tests, and
  # coverage instrumentation requires a separate workspace compilation.
  coverage:
    name: Codecov coverage
    timeout-minutes: 30
    needs: changes
    if: >-
      github.event_name == 'push' &&
      (needs.changes.outputs.rust == 'true' ||
       needs.changes.outputs.workflow == 'true')
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust build deps
        run: sudo apt-get update && sudo apt-get install -y clang lld nasm libwebp-dev

      - uses: mozilla-actions/sccache-action@v0.0.7

      - name: Probe sccache (disable on cache outage)
        shell: bash
        run: |
          set +e
          printf 'fn main() {}\n' > /tmp/sccache_probe.rs
          sccache rustc --edition 2021 -- /tmp/sccache_probe.rs -o /tmp/sccache_probe
          status=$?
          rm -f /tmp/sccache_probe /tmp/sccache_probe.rs
          if [ $status -ne 0 ]; then
            echo "sccache probe failed — disabling RUSTC_WRAPPER for this job"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            sccache --stop-server >/dev/null 2>&1 || true
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-llvm-cov
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: timeout --signal=TERM --kill-after=60s 25m cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
