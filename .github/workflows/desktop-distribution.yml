name: Desktop distribution

# Builds the signed + notarized + stapled macOS desktop app (DMG + .app zip).
# Called from release.yml on v* tags so the DMG ships on the GitHub release,
# and runnable standalone via workflow_dispatch for testing the signing path.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  distribution:
    name: Signed + notarized distribution
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    env:
      CARGO_TERM_COLOR: always
      APPLE_SIGNING_IDENTITY: "Developer ID Application: James Brink (28X9H69QGE)"
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop-distribution
      - run: bun install --frozen-lockfile

      - name: Require signing and notarization secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/mold-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"
          echo "MOLD_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple
        run: bunx tauri build --features metal --bundles app,dmg --ci

      - name: Notarize and staple DMG
        working-directory: .
        run: |
          set -euo pipefail
          dmg=$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          scripts/notarize-desktop-dmg.sh "$dmg"

      - name: Verify distribution
        working-directory: .
        run: |
          set -euo pipefail
          app="desktop/src-tauri/target/release/bundle/macos/Mold.app"
          dmg=$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          scripts/verify-desktop-release.sh "$app" "$dmg"
          mkdir -p desktop/dist
          ditto -c -k --sequesterRsrc --keepParent "$app" desktop/dist/Mold.app.zip
          cp "$dmg" desktop/dist/

      - uses: actions/upload-artifact@v7
        with:
          name: mold-desktop-macos
          path: desktop/dist/*
          if-no-files-found: error

      - name: Remove temporary signing keychain
        if: always()
        working-directory: .
        run: |
          if [ -n "${MOLD_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$MOLD_SIGNING_KEYCHAIN" || true
          fi
