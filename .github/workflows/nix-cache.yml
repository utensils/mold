name: Publish Nix Cache

on:
  push:
    branches: [main]

concurrency:
  # CUDA builds routinely outlive the interval between main pushes. Queue them
  # so each completed build reaches Cachix instead of cancelling every upload.
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Cache availability is an optimization. This separate best-effort workflow
    # can never delay or fail rolling nightlies or stable releases.
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: mold
            out_link: result-mold
          - package: mold-sm86
            out_link: result-mold-sm86
          - package: mold-sm100
            out_link: result-mold-sm100
          - package: mold-desktop-sm86
            out_link: result-mold-desktop-sm86
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - uses: cachix/install-nix-action@v31

      # Pull/build each public Nix distribution independently and push only its
      # runtime closure. Matrix parallelism keeps these best-effort builds away
      # from the native release critical path while warming every public output.
      - name: Configure Mold binary cache
        uses: cachix/cachix-action@v17
        with:
          name: mold
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
          pathsToPush: ${{ matrix.out_link }}

      - name: Build cacheable ${{ matrix.package }} output
        run: nix build ".#${{ matrix.package }}" --out-link "${{ matrix.out_link }}"
