name: Android

on:
  push:
    branches: [main]
    paths:
      [
        "apps/mobile/**",
        "studio/**",
        "ui/**",
        "package.json",
        "bun.lock",
        "bun.nix",
        "desktop/src/mobile/**",
        "desktop/src/components/**",
        "desktop/src/lib/**",
        "desktop/src/stores/**",
        "desktop/src/styles/**",
        "desktop/src/assets/**",
        "desktop/icon-master.png",
        "desktop/package.json",
        "desktop/vite.mobile.config.ts",
        "desktop/index.mobile.html",
        "scripts/android.sh",
        "scripts/generate-android-icons.sh",
        "scripts/tests/android-release-assets.sh",
        "scripts/tests/android-app-smoke.mjs",
        "scripts/tests/android-legacy-downloads.sh",
        "scripts/tests/android-legacy-media-smoke.mjs",
        "flake.nix",
        ".github/workflows/android.yml",
      ]
  pull_request:
    paths:
      [
        "apps/mobile/**",
        "studio/**",
        "ui/**",
        "package.json",
        "bun.lock",
        "bun.nix",
        "desktop/src/mobile/**",
        "desktop/src/components/**",
        "desktop/src/lib/**",
        "desktop/src/stores/**",
        "desktop/src/styles/**",
        "desktop/src/assets/**",
        "desktop/icon-master.png",
        "desktop/package.json",
        "desktop/vite.mobile.config.ts",
        "desktop/index.mobile.html",
        "scripts/android.sh",
        "scripts/generate-android-icons.sh",
        "scripts/tests/android-release-assets.sh",
        "scripts/tests/android-app-smoke.mjs",
        "scripts/tests/android-legacy-downloads.sh",
        "scripts/tests/android-legacy-media-smoke.mjs",
        "flake.nix",
        ".github/workflows/android.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify Android changes
    # Generated release-plz PRs only mirror an already-tested main revision's
    # version metadata. Match the repository-owned app and branch prefix so a
    # user-controlled branch cannot bypass Android validation.
    if: >-
      github.event_name != 'pull_request' ||
      github.actor != 'release-plz-mold[bot]' ||
      startsWith(github.head_ref, 'release-plz-') == false ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            build:
              - 'apps/mobile/plugins/**'
              - 'apps/mobile/src-tauri/**'
              - 'studio/**'
              - 'ui/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.nix'
              - 'desktop/src/mobile/**'
              - 'desktop/src/components/**'
              - 'desktop/src/lib/**'
              - 'desktop/src/stores/**'
              - 'desktop/src/styles/**'
              - 'desktop/src/assets/**'
              - 'desktop/icon-master.png'
              - 'desktop/package.json'
              - 'desktop/vite.mobile.config.ts'
              - 'desktop/index.mobile.html'
              - 'scripts/android.sh'
              - 'scripts/generate-android-icons.sh'
              - 'scripts/tests/android-release-assets.sh'
              - 'scripts/tests/android-app-smoke.mjs'
              - 'scripts/tests/android-legacy-downloads.sh'
              - 'scripts/tests/android-legacy-media-smoke.mjs'
              - 'flake.nix'
              - '.github/workflows/android.yml'

  build-and-test:
    name: Android build and native tests
    needs: changes
    if: needs.changes.outputs.build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri
          key: mold-android
      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-2.11.4
      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        # rust-cache can restore cargo-tauri even when the dedicated binary
        # cache misses. Keep this fallback idempotent across both cache layers.
        run: |
          if ! cargo tauri --version 2>/dev/null | grep -Fq '2.11.4'; then
            cargo install tauri-cli --version 2.11.4 --locked --force
          fi
      - name: Verify Tauri CLI
        run: cargo tauri --version | grep -F '2.11.4'
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Verify Android launcher assets
        run: bash scripts/tests/android-release-assets.sh
      - name: Build Android validation APK
        working-directory: apps/mobile/src-tauri
        run: cargo tauri android build --debug --apk --target aarch64 --target x86_64 --ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 35 app and instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          # The action still defaults to deprecated swiftshader_indirect;
          # use the supported renderer for standard AOSP SystemUI/Quickstep.
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            MOLD_ANDROID_EVIDENCE=/tmp/mold-android-35 bun scripts/tests/android-app-smoke.mjs
            cd apps/mobile/src-tauri/gen/android && ./gradlew --no-daemon :tauri-plugin-mold-mobile-native:connectedDebugAndroidTest
      - name: Run Android 36 app smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          # The action still defaults to deprecated swiftshader_indirect;
          # use the supported renderer for standard AOSP SystemUI/Quickstep.
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            MOLD_ANDROID_EVIDENCE=/tmp/mold-android-36 bun scripts/tests/android-app-smoke.mjs
      - name: Run Android 28 public Downloads acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_2
          # The action still defaults to deprecated swiftshader_indirect;
          # use the supported renderer for standard AOSP SystemUI/Quickstep.
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/tests/android-legacy-downloads.sh
      - name: Retain Android app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-app-smoke
          path: /tmp/mold-android-*
          if-no-files-found: warn
