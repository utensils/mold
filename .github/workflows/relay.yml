name: Lambda relay
on:
  pull_request:
    paths:
      - "relay/aws/**"
      - "crates/mold-secure/**"
      - "crates/mold-secure-client/**"
      - "crates/mold-relay/**"
      - "studio/api/**"
      - "scripts/build-secure-wasm.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/relay/**"
      - "scripts/tests/relay-*-test.py"
      - "scripts/tests/secure-framework-portability.sh"
      - "scripts/tests/secure-wasm-builder-test.py"
      - "apps/shared/build-secure-framework.sh"
      - "apps/shared/scripts/isolate-rust-staticlib.sh"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/relay.yml"
  push:
    branches: [main]
    paths:
      - "relay/aws/**"
      - "crates/mold-secure/**"
      - "crates/mold-secure-client/**"
      - "crates/mold-relay/**"
      - "studio/api/**"
      - "scripts/build-secure-wasm.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/relay/**"
      - "scripts/tests/relay-*-test.py"
      - "scripts/tests/secure-framework-portability.sh"
      - "scripts/tests/secure-wasm-builder-test.py"
      - "apps/shared/build-secure-framework.sh"
      - "apps/shared/scripts/isolate-rust-staticlib.sh"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/relay.yml"
permissions:
  contents: read
concurrency:
  group: lambda-relay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lambda-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: node --test relay/aws/test/*.test.mjs
      - run: python3 scripts/tests/relay-deploy-test.py
      - run: python3 scripts/tests/relay-diagnostics-test.py
      - run: python3 scripts/tests/relay-staging-test.py
      - run: bash scripts/tests/secure-framework-portability.sh
      - run: python3 scripts/tests/secure-wasm-builder-test.py
      - run: python3 scripts/relay/deploy.py --build-only --output "$RUNNER_TEMP/relay-packages"
      - run: |
          node -e 'import(process.env.RUNNER_TEMP + "/relay-packages/router/index.mjs")'
          node -e 'import(process.env.RUNNER_TEMP + "/relay-packages/frontend/index.mjs")'
  secure-identity-windows:
    name: Secure identity Windows runtime
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exercise owner ACL, reparse refusal, atomic identity and private client state
        run: cargo test --locked -p mold-ai-secure identity_file
  secure-protocol:
    name: Secure transport protocol
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: secure-transport
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Protocol, identity, streaming, cancellation and hostile-peer regressions
        run: cargo +1.98.0 test --locked -p mold-ai-secure -p mold-ai-secure-client -p mold-ai-relay --all-targets --features mold-ai-relay/cli
      - name: Install exact browser generator
        run: cargo +1.98.0 install wasm-bindgen-cli --version 0.2.118 --locked
      - name: Verify the browser uses this exact shared protocol
        id: browser-protocol
        env:
          MOLD_WASM_TOOLCHAIN: 1.98.0
        run: bash scripts/build-secure-wasm.sh --check
      - name: Preserve mismatched browser protocol for diagnosis
        if: failure() && steps.browser-protocol.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: secure-protocol-reproducibility
          path: studio/api/generated/secure/
          retention-days: 3
      - name: Browser cryptography, multiplexing, storage and media regressions
        run: bunx vitest run --config studio/vitest.config.ts studio/api/secureCrypto.test.ts studio/api/secureMux.test.ts studio/api/secureWire.test.ts studio/api/secureChannel.test.ts studio/api/secureObjects.test.ts studio/api/secureStore.test.ts studio/api/secureMediaWorker.test.ts studio/api/relayTransport.test.ts studio/api/connectionRoutes.test.ts studio/api/pairing.test.ts
