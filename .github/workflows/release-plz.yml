name: Release-plz

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Creates/updates the "chore: release vX.Y.Z" PR (workspace version bump),
  # then finishes it with a scripted commit: CHANGELOG.md [Unreleased]
  # promotion and the desktop-app version sync (desktop/src-tauri is excluded
  # from the workspace, so release-plz never touches it).
  #
  # Both jobs mint a GitHub App token (release-plz-mold) instead of using
  # GITHUB_TOKEN: events created with the default token never trigger other
  # workflows (GitHub's recursion guard), so CI would not run on the release
  # PR and the tag push would not trigger release.yml. The follow-up sync
  # commit is pushed with the same app token for the same reason — required
  # status checks bind to the PR HEAD SHA, which the sync commit becomes.
  release-plz-pr:
    name: Release PR
    if: github.repository_owner == 'utensils'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # git_only currently runs cargo package on the tagged workspace, which
      # cannot represent our Git-pinned backend. Supply the supported local
      # baseline explicitly instead; release-plz still decides every version.
      - name: Prepare tagged release baseline
        id: baseline
        run: |
          manifest=$(scripts/release/prepare-release-baseline.sh "$RUNNER_TEMP/release-plz-baseline")
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Install release-plz
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.3.162

      - name: Configure release bot identity
        run: |
          git config user.name "release-plz-mold[bot]"
          git config user.email "302347651+release-plz-mold[bot]@users.noreply.github.com"

      - name: Run release-plz release-pr
        id: release-plz
        env:
          GIT_TOKEN: ${{ steps.app-token.outputs.token }}
          BASELINE_MANIFEST: ${{ steps.baseline.outputs.manifest }}
        run: |
          set -euo pipefail
          output=$(release-plz release-pr --registry-manifest-path "$BASELINE_MANIFEST" \
            --repo-url "https://github.com/$GITHUB_REPOSITORY" -o json)
          pr=$(scripts/release/release-pr-output.sh <<< "$output")
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Remove release baseline
        if: always() && steps.baseline.outcome == 'success'
        run: git worktree remove --force "$RUNNER_TEMP/release-plz-baseline"

      - name: Sync release PR (changelog promotion + desktop version)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR_JSON: ${{ steps.release-plz.outputs.pr }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_PR_JSON" ]; then
            echo "release-plz returned no PR; nothing to sync."
            exit 0
          fi
          number=$(jq -r '.number // empty' <<< "$RELEASE_PR_JSON")
          branch=$(jq -r '.head_branch // empty' <<< "$RELEASE_PR_JSON")
          if [ -z "$number" ] || [ -z "$branch" ]; then
            echo "release-plz did not create or update a PR; nothing to sync."
            exit 0
          fi
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "+refs/heads/$branch:refs/heads/$branch"
          git checkout "$branch"
          scripts/release/sync-release-pr.sh
          if ! git diff --quiet; then
            git config user.name "release-plz-mold[bot]"
            git config user.email "302347651+release-plz-mold[bot]@users.noreply.github.com"
            git commit -am "chore(release): promote changelog and sync desktop version"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$branch"
          else
            echo "Release PR files already in sync."
          fi

          current_body=$(mktemp)
          rendered_body=$(mktemp)
          trap 'rm -f "$current_body" "$rendered_body"' EXIT
          gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$current_body"
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "error: could not read [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi
          scripts/release/render-release-pr-body.sh CHANGELOG.md "$version" "$current_body" > "$rendered_body"
          if ! cmp -s "$current_body" "$rendered_body"; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$rendered_body"
          else
            echo "Release PR body already in sync."
          fi

  # After the release PR merges, wait for the exact main revision's macOS
  # nightly and TestFlight upload to pass, then create and push the vX.Y.Z tag.
  # This keeps the candidate proof ahead of stable publication without putting
  # slow Linux, Nix, or Docker work back on the Apple critical path.
  #
  # Deliberately NO concurrency group: cancelling a release mid-flight can
  # skip it entirely (release-plz docs).
  release-plz-release:
    name: Release (tag)
    if: github.repository_owner == 'utensils'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Detect an unpublished release candidate
        id: candidate
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [[ -z "$version" ]]; then
            echo "::error::could not read workspace version"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      # A fragment merged between the release PR's last sync and its merge
      # (main is non-strict, so that merge is clean) would ship its code in
      # this version while its note silently waits for the next one. Refuse
      # to tag until a follow-up PR folds it into the promoted section; this
      # job re-runs on that push because the tag is still absent.
      - name: Refuse to tag with unassembled changelog fragments
        if: steps.candidate.outputs.pending == 'true'
        run: |
          set -euo pipefail
          leftover=$(find changelog.d -maxdepth 1 -name '*.md' ! -name README.md 2>/dev/null | sort)
          if [[ -n "$leftover" ]]; then
            echo "::error::changelog.d still holds fragments not assembled into CHANGELOG.md for this release:"
            while IFS= read -r f; do echo "::error::  $f"; done <<< "$leftover"
            echo "::error::Move each note under the promoted version heading in CHANGELOG.md, delete the fragment, merge, and this job will re-run."
            exit 1
          fi

      - name: Wait for exact Apple candidate delivery
        if: steps.candidate.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS='|' read -r workflow event job_name; do
            for attempt in $(seq 1 150); do
              runs_json=$(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow "$workflow" \
                  --commit "$GITHUB_SHA" \
                  --event "$event" \
                  --limit 5 \
                  --json databaseId,createdAt
              )
              found_job=false
              active_job=false
              failed_job=""
              while IFS= read -r run_id; do
                [[ -n "$run_id" ]] || continue
                job_json=$(
                  gh api \
                    "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
                    --jq ".jobs | map(select(.name == \"$job_name\")) | first // {}"
                )
                status=$(jq -r '.status // empty' <<<"$job_json")
                conclusion=$(jq -r '.conclusion // empty' <<<"$job_json")
                [[ -n "$status" ]] || continue
                found_job=true
                if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                  echo "$workflow / $job_name passed in run $run_id for $GITHUB_SHA"
                  active_job=false
                  failed_job=""
                  break 2
                elif [[ "$status" != "completed" ]]; then
                  active_job=true
                elif [[ "$conclusion" != "skipped" ]]; then
                  failed_job="$run_id:$conclusion"
                fi
              done < <(jq -r 'sort_by(.createdAt) | reverse | .[].databaseId' <<<"$runs_json")

              if [[ "$found_job" == true && "$active_job" != true && -n "$failed_job" ]]; then
                echo "::error::$workflow / $job_name candidate $failed_job"
                exit 1
              fi
              if [[ "$attempt" -eq 150 ]]; then
                echo "::error::timed out waiting for $workflow / $job_name for $GITHUB_SHA"
                exit 1
              fi
              sleep 20
            done
          done <<'WORKFLOWS'
          Desktop|push|Publish nightly update
          iOS TestFlight|workflow_run|Build, upload, and validate
          WORKFLOWS

      - name: Run release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
