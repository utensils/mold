name: iOS native app

# Mold Studio Companion (apps/ios): the native SwiftUI iPhone/iPad app. Lints,
# unit tests and the accessibility audit (every destination at xSmall, Large
# and AX5, light and dark) on an iOS 26 simulator. The Tauri iPhone app has its
# own workflow (ios.yml); the two never share a build.
#
# `macos-26` because the deployment target is iOS 26.0 and nothing older
# carries that SDK.
on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "apps/shared/**"
      - ".github/workflows/ios-native.yml"
      - ".github/workflows/testflight-ios-native.yml"
      - "scripts/tests/ios-uitest-runner.sh"
      - "scripts/tests/ios-uitest-retry.py"
      - "scripts/tests/ios-native-ci-scope.py"
      # The version stamp the Makefile reads.
      - "apps/macos/scripts/workspace-version.sh"
      # The pairing claim contract the phone redeems.
      - "crates/mold-server/src/auth.rs"
      - "studio/api/pairing.ts"
  pull_request:
    paths:
      - "apps/ios/**"
      - "apps/shared/**"
      - ".github/workflows/ios-native.yml"
      - ".github/workflows/testflight-ios-native.yml"
      - "scripts/tests/ios-uitest-runner.sh"
      - "scripts/tests/ios-uitest-retry.py"
      - "scripts/tests/ios-native-ci-scope.py"
      # The version stamp the Makefile reads.
      - "apps/macos/scripts/workspace-version.sh"
      # The pairing claim contract the phone redeems.
      - "crates/mold-server/src/auth.rs"
      - "studio/api/pairing.ts"
  workflow_dispatch:

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify native iOS audit scope
    runs-on: ubuntu-latest
    outputs:
      audit: ${{ steps.scope.outputs.audit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify audit routing contracts
        run: |
          python3 scripts/tests/ios-native-ci-scope.py
          bash scripts/tests/ci-routing-contract.sh
      - name: Select relevant app UI audits
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 apps/ios/scripts/ci-audit-scope.py \
            --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  check:
    name: Lint and unit tests
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v6
        with:
          # BUILD_NUMBER is the commit count.
          fetch-depth: 0

      - name: Show the toolchain
        run: |
          xcodebuild -version
          echo "iOS SDK: $(xcrun --show-sdk-version --sdk iphonesimulator)"
          echo "simulator: $(scripts/pick-simulator.sh)"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Architecture lints
        run: |
          make lint
          bash ../../scripts/tests/ios-uitest-runner.sh
          python3 ../../scripts/tests/ios-uitest-retry.py

      # The shared packages on the phone's platform: MoldClient's suite on an
      # iOS simulator, so a macOS-only API cannot land in them unnoticed.
      - name: Shared packages on iOS
        run: make packages-test

      - name: Unit tests
        run: make test

  audit:
    needs: changes
    if: >-
      always() && !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.audit != 'false')
    name: Accessibility audit (${{ matrix.suite.name }}, ${{ matrix.appearance }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        appearance: [light, dark]
        suite:
          - name: app
            classes: GenerationInteractionTests PopulatedGenerationTests ShellAccessibilityTests
          - name: library
            classes: HiddenCollectionTests LibraryCollectionPickerTests LibraryLongPressTests LibrarySelectionTests LibraryViewerTests NotificationTapTests
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install xcodegen
        run: brew install xcodegen

      # The iPhone passes. The hosted runner times the iPad's audits out
      # (the audit itself, UI snapshots, even synthesized taps), so the iPad
      # sweep is the local `make uitest`'s -- run it before merging iPad work.
      - name: Accessibility audit
        env:
          UITEST_APPEARANCES: ${{ matrix.appearance }}
          UITEST_CLASSES: ${{ matrix.suite.classes }}
        run: make uitest UITEST_DEVICES="$(scripts/pick-simulator.sh iPhone)"

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-reports-${{ matrix.suite.name }}-${{ matrix.appearance }}-${{ github.run_attempt }}
          path: apps/ios/build/UITestResults/
          if-no-files-found: ignore
          retention-days: 7
