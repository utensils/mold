<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08060f" />
    <meta
      name="description"
      content="mold — local AI image and video studio."
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>mold — studio</title>
    <script>
      // Apply the persisted Mold Studio theme before first paint so the app
      // never flashes the wrong palette. Mirrors web/src/lib/theme.ts.
      (function () {
        var family = "mold";
        var theme = "system";
        try {
          var raw = localStorage.getItem("mold.web.theme.v1");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.family === "safelight" || parsed.family === "mold")
              family = parsed.family;
            if (parsed.theme === "dark" || parsed.theme === "light")
              theme = parsed.theme;
          }
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.themeFamily = family;
        if (theme !== "system") root.dataset.theme = theme;
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
