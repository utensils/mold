<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0805" />
    <meta
      name="description"
      content="mold — local AI image and video studio."
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>mold — studio</title>
    <script>
      // Apply the persisted Mold Studio theme before first paint so the app
      // never flashes the wrong palette. Mirrors web/src/lib/theme.ts and the
      // shared pairing table in ui/theme.ts (Match system resolves against
      // the OS appearance here too, so a light desk never flashes dark).
      (function () {
        var pair = {
          mocha: ["mocha", "blueprint"],
          blueprint: ["mocha", "blueprint"],
          graphite: ["graphite", "porcelain"],
          porcelain: ["graphite", "porcelain"],
          safelight: ["safelight", "porcelain"],
          nebula: ["nebula", "porcelain"],
        };
        var theme = "safelight";
        var matchSystem = false;
        try {
          var raw = localStorage.getItem("mold.web.theme.v1");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (pair[parsed.theme]) {
              theme = parsed.theme;
              matchSystem = parsed.matchSystem === true;
            } else if (parsed.family === "mold") {
              theme = parsed.theme === "light" ? "blueprint" : "mocha";
              matchSystem = parsed.theme === "system";
            } else {
              if (parsed.theme === "light") theme = "porcelain";
              matchSystem = parsed.theme === "system";
            }
          }
        } catch (e) {}
        if (matchSystem && window.matchMedia) {
          var light = window.matchMedia(
            "(prefers-color-scheme: light)",
          ).matches;
          theme = pair[theme][light ? 1 : 0];
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
