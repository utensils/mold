<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#171210" />
    <meta
      name="description"
      content="mold — local AI image and video studio."
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>mold — studio</title>
    <script>
      // Apply the persisted Mold Studio theme before first paint so the app
      // never flashes the wrong palette. Mirrors ui/theme.ts: a ThemeId is
      // `<family>-<tone>`, so "Match system" is a suffix swap rather than a
      // pairing table anyone has to keep in step. The two entry points and
      // resolveTheme are pinned together by web/src/lib/prePaintTheme.test.ts.
      (function () {
        var RENAMED = {
          mocha: "mocha-dark",
          safelight: "safelight-dark",
          blueprint: "blueprint-light",
          graphite: "graphite-dark",
          porcelain: "graphite-light",
          nebula: "nebula-dark",
        };
        var ID = /^(mocha|safelight|blueprint|graphite|nebula)-(dark|light)$/;
        var theme = "safelight-dark";
        var matchSystem = false;
        try {
          var raw = localStorage.getItem("mold.web.theme.v1");
          if (raw) {
            var parsed = JSON.parse(raw);
            var family =
              parsed.family !== undefined ? parsed.family : parsed.themeFamily;
            if (ID.test(parsed.theme)) {
              theme = parsed.theme;
              matchSystem = parsed.matchSystem === true;
            } else if (RENAMED[parsed.theme]) {
              theme = RENAMED[parsed.theme];
              matchSystem = parsed.matchSystem === true;
            } else if (parsed.theme !== undefined || family !== undefined) {
              var base = family === "mold" ? "mocha" : "safelight";
              theme = base + (parsed.theme === "light" ? "-light" : "-dark");
              matchSystem = parsed.theme === "system";
            }
          }
        } catch (e) {}
        if (matchSystem && window.matchMedia) {
          var light = window.matchMedia(
            "(prefers-color-scheme: light)",
          ).matches;
          theme = theme.replace(/-(dark|light)$/, light ? "-light" : "-dark");
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
