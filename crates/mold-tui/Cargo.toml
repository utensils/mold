[package]
name = "mold-ai-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Terminal UI for mold — interactive AI image generation"

[features]
default = []
cuda = ["mold-inference/cuda"]
metal = ["mold-inference/metal"]
expand = ["mold-inference/expand"]
mp4 = ["mold-inference/mp4"]
webp = ["mold-inference/webp"]

[dependencies]
mold-core = { path = "../mold-core", package = "mold-ai-core", version = "0.26.0" }
mold-db = { path = "../mold-db", package = "mold-ai-db", version = "0.26.0" }
mold-inference = { path = "../mold-inference", package = "mold-ai-inference", version = "0.26.0" }
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
ratatui-image = "4"
tui-textarea = "0.7"
tachyonfx = "0.21"
image = "0.25"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
base64 = "0.22"
tracing = "0.1"
rand = "0.8"
sysinfo = "0.34"
dirs = "6"
unicode-width = "0.2"
open = "5"
ureq = "3"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
wiremock = "0.6"
