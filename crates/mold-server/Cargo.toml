[package]
name = "mold-ai-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "HTTP inference server for mold"
# build.rs stages the web SPA bundle into a directory that `rust-embed` picks
# up at compile time, so the final `mold` binary serves the gallery UI with no
# filesystem dependency. See `MOLD_WEB_DIST` / `MOLD_EMBED_WEB_DIR` in build.rs.
build = "build.rs"

[lib]
name = "mold_server"

[[bin]]
name = "mold-server"
path = "src/main.rs"

[features]
default = []
cuda = ["mold-inference/cuda", "nvml", "dep:cudarc"]
metal = ["mold-inference/metal"]
expand = ["mold-inference/expand"]
mp4 = ["mold-inference/mp4"]
# Public compact MiniMax H3 runtime. Device-agnostic (#1164): pair with `cuda`
# for the shipping SM89 route or with `metal` for the Apple Silicon
# correctness route. Unlike the qualification feature, this carries no capture
# binaries or external authorization-record surface.
h3 = [
    "h3-private-bridge",
    "mp4",
    "mold-core/h3",
    "mold-inference/h3",
]
# The shipping CUDA H3 route. Every published SM89 recipe names THIS, never
# `cuda,h3`: the reviewed public build graph requires it (see
# `build_support/h3_server_features.rs`), so a recipe that drops back to
# `cuda,h3` fails the build script instead of failing the post-build kernel
# verifier at publication time.
h3-cuda = ["h3", "cuda", "mold-inference/h3-cuda"]
# Structural seam for opaque, one-shot H3 owner attempts. This compiles the
# scheduler/server contract without making the private runtime runnable.
h3-private-bridge = []
# Developer-only runnable edge for the authenticated MiniMax H3 UAT runtime.
# Keep CUDA, the reviewed attention kernel, and MP4 in this exact edge so an
# incomplete private server binary cannot be built accidentally.
h3-private-uat = [
    "h3-private-bridge",
    "mold-core/h3-private-uat",
    "mold-inference/h3-private-uat",
    "mold-inference/dev-bins",
    "mold-inference/h3-attention-rc",
    "mp4",
    "cuda",
]
# PuLID-FLUX face-identity conditioning. Off by default; forwards the
# inference and core edges so `/api/models` advertises the capability only on
# a binary that will actually link the adapter.
pulid = ["mold-inference/pulid", "mold-core/pulid"]
webp = ["mold-inference/webp"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
mdns = ["dep:mdns-sd"]
nvml = ["dep:nvml-wrapper"]
# Exposes test helpers (TestApp, etc.) for integration tests.
test-support = []

[dependencies]
mold-core = { path = "../mold-core", package = "mold-ai-core", version = "0.25.0" }
mold-catalog = { path = "../mold-catalog", package = "mold-ai-catalog", version = "0.25.0" }
mold-db = { path = "../mold-db", package = "mold-ai-db", version = "0.25.0" }
mold-inference = { path = "../mold-inference", package = "mold-ai-inference", version = "0.25.0" }
mold-scheduler = { path = "../mold-scheduler", package = "mold-ai-scheduler", version = "0.25.0" }
anyhow = "1"
libc = "0.2"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-appender = "0.2"
base64 = "0.22"
futures-core = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
async-trait = "0.1"
thiserror = "1"
dirs = "5"
futures = "0.3"
utoipa = { version = "5", features = ["preserve_order"] }
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
walkdir = "2"
image = "0.25"
governor = { version = "0.8", features = ["std"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2"
hostname = "0.4"
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", optional = true, default-features = false }
mdns-sd = { version = "0.20", optional = true }
rust-embed = { version = "8", features = ["mime-guess", "interpolate-folder-path"] }
mime_guess = "2"
nvml-wrapper = { version = "0.10", optional = true }
cudarc = { version = "0.19.8", default-features = false, features = ["driver"], optional = true }
sysinfo = "0.34"
fs2 = "0.4"
async-stream = "0.3"
aead-stream = { version = "=0.6.0", features = ["alloc"] }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
zeroize = "=1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# Test-only feature unification lets the server prove its frozen H3 authority
# against the private loader without exposing that loader on a runnable feature.
mold-inference = { path = "../mold-inference", package = "mold-ai-inference", version = "0.25.0", features = ["h3-private-uat"] }
filetime = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
mp4-rs = { package = "mp4", version = "0.14" }
# Chain route tests build a synthetic motion-tail Tensor via the same
# candle APIs the inference crate uses — keep this in lockstep with
# Keep server tests on the same patched official Candle identity as inference.
candle-core = "0.11"
# Live-search integration tests stub Civitai with a wiremock server.
wiremock = "0.6"
