[package]
name = "mold-ai-secure"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mold_secure"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
base64 = "0.22"
snow = { version = "=0.10.0", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
