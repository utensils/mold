[package]
name = "mold-ai-inference"
version.workspace = true
edition.workspace = true
# The LTX-2 video transformer/VAE retain Apache-2.0 portions ported from
# FerrisMind/candle-video; see this crate's THIRD_PARTY_NOTICES.md and
# LICENSE-APACHE-2.0 (both ship in the published package).
license = "MIT AND Apache-2.0"
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Candle-based inference engine for mold — FLUX, SDXL, SD3.5, Z-Image diffusion models"
autobins = false

[lib]
name = "mold_inference"

[features]
default = []
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "mold-candle/cuda",
    "dep:cudarc",
]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal", "mold-candle/metal"]
# FlashAttention v2 dispatch path. Implies `cuda` (flash-attn is CUDA-only).
# Off by default — pulls in the candle-flash-attn build, which requires the
# CUDA toolkit. Tensors that aren't CUDA + fp16/bf16 transparently fall back
# to the math path inside `crate::attention`.
flash-attn = ["dep:candle-flash-attn", "cuda", "mold-candle/flash-attn"]
# H3-only kernel qualification. Unlike `flash-attn`, this does not change the
# global attention default and is intentionally not forwarded by mold-ai.
h3-attention-rc = ["cuda", "mold-candle/h3-flash-attn-rc"]
expand = []
webp = ["webp-animation"]
mp4 = ["dep:fdk-aac"]
dev-bins = []
# Public compact MiniMax H3 runtime. MP4 audio muxing and the public core
# policy move with the family; the DEVICE does not (#1164). A CUDA build pairs
# `h3` with `cuda` + `h3-attention-rc`; a macOS build pairs it with `metal` and
# takes the chunked dense correctness route. `h3` implying `cuda` made an Apple
# Silicon H3 build inexpressible, since `cuda` cannot compile there at all.
h3 = [
    "mp4",
    "mold-candle/h3",
    "mold-core/h3",
]
# The shipping CUDA H3 route: the family plus the SM89 attention kernel.
h3-cuda = ["h3", "cuda", "h3-attention-rc"]
# Development-only access to the authorization-bound MiniMax H3 artifact
# qualifier. This feature is intentionally not forwarded by mold-ai or any
# shipping surface; release verification rejects its embedded claim marker.
h3-private-uat = ["mold-candle/h3-private-uat"]

[[bin]]
name = "ltx2_checkpoint_probe"
path = "src/bin/ltx2_checkpoint_probe.rs"
required-features = ["dev-bins"]

[[bin]]
name = "ltx2_review"
path = "src/bin/ltx2_review.rs"
required-features = ["dev-bins"]

[[bin]]
name = "ltx2_vae_probe"
path = "src/bin/ltx2_vae_probe.rs"
required-features = ["dev-bins", "mp4"]

[[bin]]
name = "sd_singlefile_inspect"
path = "src/bin/sd_singlefile_inspect.rs"
required-features = ["dev-bins"]

# Needs `flash-attn` on top of `dev-bins` to measure anything: without it the
# flash column silently benchmarks the math fallback.
[[bin]]
name = "attention_bench"
path = "src/bin/attention_bench.rs"
required-features = ["dev-bins", "cuda"]

[[bin]]
name = "h3_attention_qualification"
path = "src/bin/h3_attention_qualification.rs"
required-features = ["dev-bins", "h3-attention-rc"]

[[bin]]
name = "h3_attention_benchmark"
path = "src/bin/h3_attention_benchmark.rs"
required-features = ["dev-bins", "h3-attention-rc"]

[[bin]]
name = "h3_artifact_qualification"
path = "src/bin/h3_artifact_qualification.rs"
required-features = ["dev-bins", "h3-private-uat"]

[[bin]]
name = "h3_runtime_qualification_record"
path = "src/bin/h3_runtime_qualification_record.rs"
required-features = ["dev-bins", "h3-cuda"]

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "h3_qwen_layer50_capture"
path = "src/bin/h3_qwen_layer50_capture.rs"
required-features = ["dev-bins", "h3-private-uat"]

[[bin]]
name = "h3_visual_vae_capture"
path = "src/bin/h3_visual_vae_capture.rs"
required-features = ["dev-bins", "h3-private-uat", "cuda"]

[[bin]]
name = "h3_audio_vae_capture"
path = "src/bin/h3_audio_vae_capture.rs"
required-features = ["dev-bins", "h3-private-uat"]

[[bin]]
name = "h3_transformer_capture"
path = "src/bin/h3_transformer_capture.rs"
required-features = ["dev-bins", "h3-private-uat"]

[dependencies]
mold-core = { path = "../mold-core", package = "mold-ai-core", version = "0.23.3" }
mold-catalog = { path = "../mold-catalog", package = "mold-ai-catalog", version = "0.23.3" }
mold-candle = { path = "../mold-candle", package = "mold-ai-candle", version = "0.23.3" }
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
cudarc = { version = "0.19.8", default-features = false, features = ["driver"], optional = true }
# Optional flash-attention v2. Pulled in only by the `flash-attn` feature.
#
# This now resolves through the same workspace-root `candle-core` patch as
# Mold, so its `Tensor` type is identical to ours.
candle-flash-attn = { version = "0.11", optional = true }
gif = "0.13"
webp-animation = { version = "0.10", features = ["static"], optional = true }
image = "0.25"
moxcms = "0.8"
half = "2"
# Already vendored transitively through candle-core, so these add no new
# crates to the Nix vendor set. `float8` must resolve to the same version
# candle uses or `F8E4M3` would be a different type than its tensors hold.
float8 = "0.7"
rayon = "1"
libc = "0.2"
# Already vendored transitively via image's default features, so a direct
# dependency adds no new crates to the Nix vendor set. Pure Rust: no system
# OpenEXR, no cmake, nothing to cross-compile for the sm86/89/100/120 matrix.
exr = "1.74"
base64 = "0.22"
fs2 = "0.4"
mp4-rs = { package = "mp4", version = "0.14" }
openh264 = { version = "0.9", features = ["source"] }
png = "0.18"
rand = "0.8"
rand_distr = "0.4"
rustfft = "6"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tempfile = "3"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
fdk-aac = { version = "0.8", optional = true }
